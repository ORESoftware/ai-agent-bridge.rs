# flags-2-env config: maps CLI flags to the environment variables the service
# reads, so operators can pass `--http-port` etc. without exporting env by hand.
# Secrets (tokens, DB URLs) are listed under [env].ignore so they stay env-only.

[help]
url = "https://github.com/fiducia-cloud/fiducia-ai-agent-bridge.rs"
columns = ["options", "env", "type", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["DATABASE_URL", "RDS_DATABASE_URL", "API_AUTH_BEARER", "AI_AGENT_BRIDGE_TOKEN", "CLAUDE_INBOX_TOKEN", "EMBEDDINGS_API_AUTH_BEARER", "EMBEDDINGS_BEARER", "FIDUCIA_CONTROL_PLANE_SECRET", "FIDUCIA_INTERNAL_SECRET"]

[flags.host]
env = "HOST"
aliases = ["host"]
type = "string"
help = "Listen address for HTTP and TCP."

[flags.http-port]
env = "HTTP_PORT"
aliases = ["http-port"]
type = "integer"
help = "HTTP REST and SSE listen port."

[flags.tcp-port]
env = "TCP_PORT"
aliases = ["tcp-port"]
type = "integer"
help = "TCP JSONL listen port."

[flags.embed-dim]
env = "EMBED_DIM"
aliases = ["embed-dim"]
type = "integer"
help = "Embedding vector dimension."

[flags.embeddings-url]
env = "EMBEDDINGS_URL"
aliases = ["embeddings-url"]
type = "string"
help = "Optional remote embeddings endpoint."

[flags.embeddings-model]
env = "EMBEDDINGS_MODEL"
aliases = ["embeddings-model"]
type = "string"
help = "Embedding model identifier."

[flags.history-limit]
env = "HISTORY_LIMIT"
aliases = ["history-limit"]
type = "integer"
help = "Maximum retained messages per channel."

[flags.max-channels]
env = "MAX_CHANNELS"
aliases = ["max-channels"]
type = "integer"
help = "Maximum number of channels."

[flags.max-agents]
env = "MAX_AGENTS"
aliases = ["max-agents"]
type = "integer"
help = "Maximum registered agents."

[flags.log-format]
env = "LOG_FORMAT"
aliases = ["log-format"]
type = "string"
help = "Log output format, such as json."

[flags.fiducia-control-plane-url]
env = "FIDUCIA_CONTROL_PLANE_URL"
aliases = ["fiducia-control-plane-url"]
type = "string"
help = "Agent control-plane base URL for file leases and holder lookup."

[flags.control-plane-timeout-secs]
env = "CONTROL_PLANE_TIMEOUT_SECS"
aliases = ["control-plane-timeout-secs"]
type = "integer"
help = "Bridge-to-control-plane HTTP timeout in seconds."
