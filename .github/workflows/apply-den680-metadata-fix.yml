name: apply DEN-680 Prometheus metadata fix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-den680-prometheus-metadata-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/den-680-prometheus-metrics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: recursive

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Emit one metadata declaration and classify only 2xx as success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          metrics = Path('src/metrics.rs')
          lines = metrics.read_text(encoding='utf-8').splitlines()

          first_call_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip()
              == 'capacity_gauge(&mut output, "agents", snapshot.agents, snapshot.max_agents);'
          ]
          if len(first_call_indexes) != 1:
              raise SystemExit(
                  f'expected one first capacity sample, found {len(first_call_indexes)}'
              )
          first_call_index = first_call_indexes[0]
          indent = lines[first_call_index][:-len(lines[first_call_index].lstrip())]
          lines[first_call_index:first_call_index] = [
              f'{indent}metric_header(',
              f'{indent}    &mut output,',
              f'{indent}    "ai_agent_bridge_capacity",',
              f'{indent}    "Current usage and configured limit for bounded bridge resources.",',
              f'{indent}    "gauge",',
              f'{indent});',
          ]

          helper_indexes = [
              index
              for index, line in enumerate(lines)
              if line.startswith('fn capacity_gauge(')
          ]
          if len(helper_indexes) != 1:
              raise SystemExit(
                  f'expected one capacity helper, found {len(helper_indexes)}'
              )
          helper_index = helper_indexes[0]
          metadata_start = next(
              (
                  index
                  for index in range(helper_index + 1, min(helper_index + 20, len(lines)))
                  if lines[index].strip() == 'metric_header('
              ),
              None,
          )
          if metadata_start is None:
              raise SystemExit('capacity helper metadata call is missing')
          metadata_end = next(
              (
                  index
                  for index in range(metadata_start + 1, min(metadata_start + 15, len(lines)))
                  if lines[index].strip() == ');'
              ),
              None,
          )
          if metadata_end is None:
              raise SystemExit('capacity helper metadata call is unterminated')
          del lines[metadata_start : metadata_end + 1]
          metrics.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          control = Path('src/control_plane.rs')
          lines = control.read_text(encoding='utf-8').splitlines()
          result_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip()
              == '200..=399 => crate::metrics::ControlPlaneResult::Success,'
          ]
          if len(result_indexes) != 1:
              raise SystemExit(
                  f'expected one control-plane success arm, found {len(result_indexes)}'
              )
          index = result_indexes[0]
          arm_indent = lines[index][:-len(lines[index].lstrip())]
          lines[index] = (
              f'{arm_indent}200..=299 => crate::metrics::ControlPlaneResult::Success,'
          )
          control.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          tests = Path('tests/metrics.rs')
          text = tests.read_text(encoding='utf-8')
          addition = '''

          #[test]
          fn registry_declares_each_prometheus_metadata_line_once() {
              let state = common::state();
              let text = metrics::global().render(&state);
              let mut help = std::collections::BTreeSet::new();
              let mut metric_types = std::collections::BTreeSet::new();

              for line in text.lines() {
                  if let Some(name) = line
                      .strip_prefix("# HELP ")
                      .and_then(|line| line.split_whitespace().next())
                  {
                      assert!(help.insert(name), "duplicate HELP metadata for {name}");
                  }
                  if let Some(name) = line
                      .strip_prefix("# TYPE ")
                      .and_then(|line| line.split_whitespace().next())
                  {
                      assert!(
                          metric_types.insert(name),
                          "duplicate TYPE metadata for {name}"
                      );
                  }
              }

              assert_eq!(text.matches("# HELP ai_agent_bridge_capacity ").count(), 1);
              assert_eq!(
                  text.matches("# TYPE ai_agent_bridge_capacity gauge").count(),
                  1,
              );
          }
          '''
          if 'registry_declares_each_prometheus_metadata_line_once' in text:
              raise SystemExit('metadata uniqueness test already exists')
          tests.write_text(text + addition, encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo test --all-targets --locked --features postgres
          git diff --check

      - name: Remove one-shot workflow and commit the semantic fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-den680-metadata-fix.yml
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(metrics): emit valid metadata and strict success classes'
          git push origin "HEAD:${HEAD_BRANCH}"
