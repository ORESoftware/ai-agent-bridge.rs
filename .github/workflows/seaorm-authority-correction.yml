name: seaorm-authority-correction

on:
  pull_request:
    paths:
      - ".github/workflows/seaorm-authority-correction.yml"
      - ".github/workflows/ci.yml"
      - "scripts/seaorm-policy.mjs"
      - "scripts/seaorm-policy.test.mjs"
      - "docs/postgres-seaorm.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaorm-authority-correction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            .github/workflows/ci.yml
            .github/workflows/seaorm-authority-correction.yml
      - name: Mutation-test the corrected SeaORM policy parser
        run: node --test scripts/seaorm-policy.test.mjs
      - name: Require the actual dpm authority and retired workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'declarative-migrations/declarative-postgres-migrate.rs' docs/postgres-seaorm.md
          grep -F 'dpm-v0.3.2-x86_64-unknown-linux-gnu.tar.gz' docs/postgres-seaorm.md
          grep -F '4258755a946f6f3a49e33538889523e4736180624a186bddc90180994612d3aa' docs/postgres-seaorm.md
          test ! -e .github/workflows/seaorm-branch.yml
          test ! -e .github/workflows/seaorm-finalize.yml
          test ! -e .github/workflows/seaorm-exact.yml
