name: DEN-766 one-shot clippy repair

on:
  push:
    branches:
      - agent/den-766-slack-dual-model-router

permissions:
  contents: write

concurrency:
  group: den-766-clippy-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-766-slack-dual-model-router
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Collapse the successful-post journal condition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/slack_bridge.rs')
          source = path.read_text(encoding='utf-8')
          old = '''        if app
              .post_slack_reply(&event.channel, &event.thread_ts, &text)
              .await
              .is_ok()
          {
              if app
                  .store
                  .mark_posted(&event.event_id, model.agent_key)
                  .is_err()
              {
                  warn!("failed to persist partial-failure reply marker");
                  emit_metric("journal_failure");
                  return;
              }
          }
'''
          new = '''        if app
              .post_slack_reply(&event.channel, &event.thread_ts, &text)
              .await
              .is_ok()
              && app
                  .store
                  .mark_posted(&event.event_id, model.agent_key)
                  .is_err()
          {
              warn!("failed to persist partial-failure reply marker");
              emit_metric("journal_failure");
              return;
          }
'''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one partial-failure journal block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
      - name: Validate the repaired branch
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
      - name: Commit permanent repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-766-clippy-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/slack_bridge.rs
          git commit -m 'fix(DEN-766): satisfy Slack bridge clippy gate'
          git push origin HEAD:agent/den-766-slack-dual-model-router
