name: Apply deprecation banner

on:
  push:
    branches:
      - chore/deprecate-in-favor-of-agent-pontifex

permissions:
  contents: write

concurrency:
  group: apply-deprecation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepend repository-scoped deprecation policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          readme_marker = '<!-- ores-deprecated: agent-pontifex -->'
          readme_banner = '''<!-- ores-deprecated: agent-pontifex -->
          > [!WARNING]
          > **DEPRECATED — do not start new feature work in this repository.**
          >
          > `ORESoftware/ai-agent-bridge.rs` is superseded by the repositories in [agent-pontifex](https://github.com/agent-pontifex). Migrate active consumers and new agent-bridge work there. During migration, changes here must be limited to security fixes, migration support, or narrowly scoped compatibility fixes.
          >
          > Deprecation recorded: 2026-09-01.

          '''

          agents_marker = '<!-- ores-deprecated-agents: agent-pontifex -->'
          agents_banner = '''<!-- ores-deprecated-agents: agent-pontifex -->
          # DEPRECATED REPOSITORY — MIGRATE TO AGENT PONTIFEX

          `ORESoftware/ai-agent-bridge.rs` is superseded by [agent-pontifex](https://github.com/agent-pontifex).

          Agents must not add new product features here. Work in this repository is restricted to security remediation, migration tooling/documentation, and compatibility fixes required to move consumers to agent-pontifex. Keep every change scoped to this repository unless a separately authorized task explicitly names another repository.

          '''

          def prepend(path: Path, marker: str, banner: str) -> None:
              current = path.read_text(encoding='utf-8') if path.exists() else ''
              if marker not in current:
                  path.write_text(banner + current, encoding='utf-8')

          prepend(Path('README.md'), readme_marker, readme_banner)
          prepend(Path('AGENTS.md'), agents_marker, agents_banner)
          PY

          rm -- .github/workflows/apply-deprecation-banner.yml
          git config user.name 'ores-gh-bots'
          git config user.email 'ores-gh-bots@users.noreply.github.com'
          git add README.md AGENTS.md .github/workflows/apply-deprecation-banner.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: deprecate in favor of agent-pontifex'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
