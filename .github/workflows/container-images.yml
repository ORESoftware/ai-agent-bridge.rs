name: container image authority

on:
  pull_request:
    paths:
      - .github/workflows/container-images.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - vendor/k8s-libs-and-shared-defs
  push:
    branches: [main]
    paths:
      - .github/workflows/container-images.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - vendor/k8s-libs-and-shared-defs
  workflow_dispatch:

# Ordinary bridge CI must not receive a credential for the private shared-schema
# repository. PostgreSQL-enabled image certification and publication are owned by
# ORESoftware/k8s-cluster#1107 under its reviewed credential boundary.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHARED_COMMIT: e76b23cb2e23782438a3b03dacc26adfab1bb7fb
  K8S_CERTIFICATION_ISSUE: ORESoftware/k8s-cluster#1107

jobs:
  authority-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Validate image authority boundary
        shell: bash
        run: |
          set -euo pipefail

          test "$(git ls-tree HEAD vendor/k8s-libs-and-shared-defs | awk '{print $3}')" = \
            "${EXPECTED_SHARED_COMMIT}"

          grep -F 'cargo build --locked --release --features postgres --bin "${BINARY}"' Dockerfile
          grep -F 'ORESoftware/k8s-cluster#1107' .github/workflows/container-images.yml

          for binary in \
            fiducia-ai-agent-bridge \
            fiducia-ai-agent-runner \
            fiducia-slack-bridge \
            fiducia-slack-command; do
            grep -F "name = \"${binary}\"" Cargo.toml
          done

          ! grep -Eq \
            'packages:[[:space:]]*write|docker/login-action|docker/build-push-action|push:[[:space:]]*true' \
            .github/workflows/container-images.yml

          git diff --check

      - name: Record delegated certification status
        shell: bash
        run: |
          {
            echo '## PostgreSQL-enabled image authority'
            echo
            echo '- Bridge workflow: credential-free policy guard only'
            echo "- Shared-schema gitlink: \`${EXPECTED_SHARED_COMMIT}\`"
            echo "- Private DPM/PostgreSQL/image certification owner: \`${K8S_CERTIFICATION_ISSUE}\`"
            echo '- Registry publication: disabled here until exact-head certification and immutable digest evidence exist'
          } >>"${GITHUB_STEP_SUMMARY}"
