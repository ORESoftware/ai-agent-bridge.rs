name: container images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .gitmodules
      - Cargo.toml
      - Cargo.lock
      - src/**
      - config/shared-schema-pin
      - scripts/ci/prepare-credential-free-build.sh
      - scripts/ci/fixtures/dd-pg-defs-sea-orm/**
      - scripts/container-images-policy.test.mjs
      - .github/workflows/container-images.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ores-client
            image: ores-ai-agent-bridge-client
            entrypoint: /usr/local/bin/ores-ai-agent-bridge
            help_contract: true
          - target: bridge
            image: fiducia-ai-agent-bridge
            entrypoint: /usr/local/bin/fiducia-ai-agent-bridge
            help_contract: false
          - target: runner
            image: fiducia-ai-agent-runner
            entrypoint: /usr/local/bin/fiducia-ai-agent-runner
            help_contract: false
          - target: slack
            image: fiducia-slack-bridge
            entrypoint: /usr/local/bin/fiducia-slack-bridge
            help_contract: false
          - target: slack-command
            image: fiducia-slack-command
            entrypoint: /usr/local/bin/fiducia-slack-command
            help_contract: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare credential-free runtime build inputs
        run: bash scripts/ci/prepare-credential-free-build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/oresoftware/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local image for pull-request contract tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Verify local non-root runtime contract
        env:
          IMAGE: local/${{ matrix.image }}:${{ github.sha }}
          EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 'nonroot:nonroot'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$IMAGE")" = "$EXPECTED_ENTRYPOINT"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "$IMAGE")"

      - name: Verify local ORES client help contract
        if: matrix.help_contract
        env:
          IMAGE: local/${{ matrix.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          output="$(docker run --rm "$IMAGE" --help)"
          grep -F 'com.ores.ai-agent-bridge' <<<"$output"
          grep -F 'ORES_AI_AGENT_BRIDGE_BEARER' <<<"$output"
          if grep -F -- '--bearer' <<<"$output"; then
            echo '::error::The ORES client must not accept bearer credentials on the command line' >&2
            exit 1
          fi

      - name: Scan local pull-request candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          scope: oresoftware/${{ matrix.image }}@push

      - name: Publish digest-addressable image with SBOM and provenance
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: mode=max

      - name: Resolve exact published image
        id: exact
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ghcr.io/oresoftware/${{ matrix.image }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Buildx returned an invalid manifest digest" >&2
            exit 1
          fi
          image_ref="${IMAGE}@${DIGEST}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Pull exact published digest
        if: github.event_name == 'push'
        env:
          PUBLISHED_IMAGE: ${{ steps.exact.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "${PUBLISHED_IMAGE}"

      - name: Verify exact published runtime contract
        if: github.event_name == 'push'
        env:
          EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
          PUBLISHED_IMAGE: ${{ steps.exact.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${PUBLISHED_IMAGE}")" = 'nonroot:nonroot'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${PUBLISHED_IMAGE}")" = "${EXPECTED_ENTRYPOINT}"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "${PUBLISHED_IMAGE}")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${PUBLISHED_IMAGE}")" = "${SOURCE_SHA}"

      - name: Verify exact published ORES client help contract
        if: github.event_name == 'push' && matrix.help_contract
        env:
          PUBLISHED_IMAGE: ${{ steps.exact.outputs.image_ref }}
        run: |
          set -euo pipefail
          output="$(docker run --rm "${PUBLISHED_IMAGE}" --help)"
          grep -F 'com.ores.ai-agent-bridge' <<<"$output"
          grep -F 'ORES_AI_AGENT_BRIDGE_BEARER' <<<"$output"
          if grep -F -- '--bearer' <<<"$output"; then
            echo '::error::The published ORES client must not accept bearer credentials on the command line' >&2
            exit 1
          fi

      - name: Scan exact published digest
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.exact.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Write machine-readable digest evidence
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ghcr.io/oresoftware/${{ matrix.image }}
          IMAGE_REF: ${{ steps.exact.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/image-digest-evidence"
          mkdir -p "${evidence_dir}"
          jq -n \
            --arg digest "${DIGEST}" \
            --arg image "${IMAGE}" \
            --arg image_ref "${IMAGE_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg target "${TARGET}" \
            '{
              schema_version: 2,
              repository: $repository,
              source_sha: $source_sha,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              target: $target,
              image: $image,
              digest: $digest,
              image_ref: $image_ref,
              exact_digest_pulled: true,
              exact_runtime_contract_verified: true,
              exact_digest_vulnerability_scan: "passed"
            }' >"${evidence_dir}/${TARGET}.json"
          jq -e '
            .schema_version == 2 and
            (.source_sha | test("^[0-9a-f]{40}$")) and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            .image_ref == (.image + "@" + .digest) and
            .exact_digest_pulled == true and
            .exact_runtime_contract_verified == true and
            .exact_digest_vulnerability_scan == "passed"
          ' "${evidence_dir}/${TARGET}.json"

      - name: Upload machine-readable digest evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-digest-evidence/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Record published digest
        if: github.event_name == 'push'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "\`${{ steps.exact.outputs.image_ref }}\`"
            echo
            echo "Evidence artifact: \`image-digest-${{ matrix.target }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo 'The exact published digest was pulled, runtime-inspected, and vulnerability-scanned before evidence publication.'
          } >> "$GITHUB_STEP_SUMMARY"
