name: container images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .cli-flags.toml
      - .github/workflows/ci.yml
      - .github/workflows/format-den-1041.yml
      - .github/workflows/container-images.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-1041-ores-slash-commands'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Apply formatting and restore canonical workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('src/slack_commands.rs')
          source.write_text(source.read_text().replace('    path::{Path, PathBuf},\n', '    path::PathBuf,\n'))

          flags = Path('.cli-flags.toml')
          text = flags.read_text()
          text = text.replace(
              '"SLACK_SIGNING_SECRET", "SLACK_BOT_TOKEN", "SLACK_BRIDGE_BEARER"]',
              '"SLACK_SIGNING_SECRET", "SLACK_BOT_TOKEN", "SLACK_BRIDGE_BEARER", "SLACK_COORDINATOR_BEARER"]',
          )
          addition = '''

# ORESoftware Slack slash-command process. Credentials remain in [env].ignore.
[flags.slack-command-host]
env = "SLACK_COMMAND_HOST"
aliases = ["slack-command-host"]
type = "string"
help = "Listen address for the ORESoftware Slack slash-command process."

[flags.slack-command-port]
env = "SLACK_COMMAND_PORT"
aliases = ["slack-command-port"]
type = "integer"
help = "HTTP port for ORESoftware Slack commands and interactions."

[flags.slack-project-registry-path]
env = "SLACK_PROJECT_REGISTRY_PATH"
aliases = ["slack-project-registry-path"]
type = "string"
help = "Absolute path to the reviewed Slack channel to Linear project registry."

[flags.slack-command-state-dir]
env = "SLACK_COMMAND_STATE_DIR"
aliases = ["slack-command-state-dir"]
type = "string"
help = "Absolute private directory for create-once Slack command run claims."

[flags.slack-coordinator-url]
env = "SLACK_COORDINATOR_URL"
aliases = ["slack-coordinator-url"]
type = "string"
help = "Base URL for the durable AI agent coordinator job API."

[flags.slack-chatgpt-agent-key]
env = "SLACK_CHATGPT_AGENT_KEY"
aliases = ["slack-chatgpt-agent-key"]
type = "string"
help = "Registered bridge identity used by /ores-chatgpt."

[flags.slack-linear-run-project-id]
env = "SLACK_LINEAR_RUN_PROJECT_ID"
aliases = ["slack-linear-run-project-id"]
type = "string"
help = "Linear project ID for the durable AI Agent Run Queue projection."

[flags.slack-context-message-count]
env = "SLACK_CONTEXT_MESSAGE_COUNT"
aliases = ["slack-context-message-count"]
type = "integer"
help = "Default recent non-bot Slack messages attached as untrusted task context."

[flags.slack-command-max-concurrent-runs]
env = "SLACK_COMMAND_MAX_CONCURRENT_RUNS"
aliases = ["slack-command-max-concurrent-runs"]
type = "integer"
help = "Maximum concurrently dispatching Slack slash-command runs."

[flags.slack-command-dry-run]
env = "SLACK_COMMAND_DRY_RUN"
aliases = ["slack-command-dry-run"]
type = "string"
help = "Keep Slack slash commands from creating bridge workflows or coordinator jobs."
'''
          if '[flags.slack-command-host]' not in text:
              text = text.rstrip() + addition
          flags.write_text(text)

          temporary = Path('.github/workflows/format-den-1041.yml')
          if temporary.exists():
              temporary.unlink()
          PY
          cargo fmt --all
          cat > .github/workflows/ci.yml <<'EOF'
          # CI pipeline: secret hygiene, formatting, clippy (warnings as errors), tests, a
          # postgres-feature check, and a flags-2-env config audit on every PR and push.
          name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              services:
                postgres:
                  image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
                  env:
                    POSTGRES_DB: bridge_restart
                    POSTGRES_USER: bridge
                    POSTGRES_PASSWORD: bridge-test-only
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd "pg_isready -U bridge -d bridge_restart"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7.0.1
                  with:
                    persist-credentials: false
                    submodules: recursive
                - name: Validate GitHub Actions
                  uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
                  with:
                    args: ./.github/workflows/ci.yml
                - name: Audit provider credential hygiene
                  run: python3 scripts/audit-provider-secrets.py
                - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
                  with:
                    toolchain: "1.95.0"
                    components: rustfmt, clippy
                - run: cargo fmt --all -- --check
                - run: cargo clippy --all-targets --locked --features postgres -- -D warnings
                - run: cargo test --all-targets --locked
                - run: cargo check --all-targets --locked --features postgres
                - name: Test PostgreSQL restart durability
                  env:
                    FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
                  run: cargo test --locked --features postgres --test postgres_restart -- --ignored
                - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
                  with:
                    tool: cargo-audit@0.22.2
                - run: cargo audit
                - run: make -B -C vendor/flags-2-env all
                - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml
          EOF
          sed -i 's/^          //' .github/workflows/ci.yml
          cat > .github/workflows/container-images.yml <<'EOF'
          name: container images

          on:
            pull_request:
              paths:
                - Dockerfile
                - .dockerignore
                - Cargo.toml
                - Cargo.lock
                - src/**
                - .github/workflows/container-images.yml
            push:
              branches: [main]
              tags: ['v*']

          permissions:
            contents: read
            packages: write

          concurrency:
            group: container-images-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            image:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - target: bridge
                      image: fiducia-ai-agent-bridge
                      entrypoint: /usr/local/bin/fiducia-ai-agent-bridge
                    - target: runner
                      image: fiducia-ai-agent-runner
                      entrypoint: /usr/local/bin/fiducia-ai-agent-runner
                    - target: slack
                      image: fiducia-slack-bridge
                      entrypoint: /usr/local/bin/fiducia-slack-bridge
                    - target: slack-command
                      image: fiducia-slack-command
                      entrypoint: /usr/local/bin/fiducia-slack-command
              steps:
                - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
                  with:
                    persist-credentials: false
                    submodules: recursive
                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v4
                - name: Extract immutable image metadata
                  id: meta
                  uses: docker/metadata-action@v6
                  with:
                    images: ghcr.io/oresoftware/${{ matrix.image }}
                    flavor: latest=false
                    tags: |
                      type=sha,format=long
                      type=ref,event=tag
                      type=raw,value=main,enable={{is_default_branch}}
                    labels: |
                      org.opencontainers.image.title=${{ matrix.image }}
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                - name: Build local image for contract tests
                  uses: docker/build-push-action@v7
                  with:
                    context: .
                    target: ${{ matrix.target }}
                    platforms: linux/amd64
                    load: true
                    push: false
                    tags: local/${{ matrix.image }}:${{ github.sha }}
                    cache-from: type=gha,scope=${{ matrix.target }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.target }}
                - name: Verify non-root immutable runtime contract
                  env:
                    IMAGE: local/${{ matrix.image }}:${{ github.sha }}
                    EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
                  run: |
                    set -euo pipefail
                    test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 'nonroot:nonroot'
                    test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$IMAGE")" = "$EXPECTED_ENTRYPOINT"
                    test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "$IMAGE")"
                - name: Scan image for high and critical vulnerabilities
                  uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
                  with:
                    image-ref: local/${{ matrix.image }}:${{ github.sha }}
                    format: table
                    exit-code: '1'
                    ignore-unfixed: true
                    vuln-type: os,library
                    severity: HIGH,CRITICAL
                - name: Log in to GitHub Container Registry
                  if: github.event_name == 'push'
                  uses: docker/login-action@v4
                  with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
                    scope: oresoftware/${{ matrix.image }}@push
                - name: Publish digest-addressable image with SBOM and provenance
                  id: publish
                  if: github.event_name == 'push'
                  uses: docker/build-push-action@v7
                  with:
                    context: .
                    target: ${{ matrix.target }}
                    platforms: linux/amd64
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    annotations: ${{ steps.meta.outputs.annotations }}
                    cache-from: type=gha,scope=${{ matrix.target }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.target }}
                    sbom: true
                    provenance: mode=max
                - name: Record published digest
                  if: github.event_name == 'push'
                  run: |
                    {
                      echo '### ${{ matrix.image }}'
                      echo
                      echo '`${{ steps.publish.outputs.digest }}`'
                      echo
                      echo 'Deploy by digest only; tags are discovery aliases.'
                    } >> "$GITHUB_STEP_SUMMARY"
          EOF
          sed -i 's/^          //' .github/workflows/container-images.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'DEN-1041 format command service and certify images'
          git push origin HEAD:${GITHUB_HEAD_REF}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bridge
            image: fiducia-ai-agent-bridge
            entrypoint: /usr/local/bin/fiducia-ai-agent-bridge
          - target: runner
            image: fiducia-ai-agent-runner
            entrypoint: /usr/local/bin/fiducia-ai-agent-runner
          - target: slack
            image: fiducia-slack-bridge
            entrypoint: /usr/local/bin/fiducia-slack-bridge
          - target: slack-command
            image: fiducia-slack-command
            entrypoint: /usr/local/bin/fiducia-slack-command
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/oresoftware/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build local image for contract tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify non-root immutable runtime contract
        env:
          IMAGE: local/${{ matrix.image }}:${{ github.sha }}
          EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 'nonroot:nonroot'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$IMAGE")" = "$EXPECTED_ENTRYPOINT"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "$IMAGE")"
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          scope: oresoftware/${{ matrix.image }}@push
      - name: Publish digest-addressable image with SBOM and provenance
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: mode=max
      - name: Record published digest
        if: github.event_name == 'push'
        run: |
          {
            echo '### ${{ matrix.image }}'
            echo
            echo '`${{ steps.publish.outputs.digest }}`'
            echo
            echo 'Deploy by digest only; tags are discovery aliases.'
          } >> "$GITHUB_STEP_SUMMARY"
