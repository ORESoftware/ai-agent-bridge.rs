name: container images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - runtime-state/**
      - .github/workflows/container-images.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}-${{ matrix.target }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bridge
            image: fiducia-ai-agent-bridge
            entrypoint: /usr/local/bin/fiducia-ai-agent-bridge
          - target: runner
            image: fiducia-ai-agent-runner
            entrypoint: /usr/local/bin/fiducia-ai-agent-runner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/oresoftware/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local image for contract tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Verify non-root immutable runtime contract
        env:
          IMAGE: local/${{ matrix.image }}:${{ github.sha }}
          EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 'nonroot:nonroot'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$IMAGE")" = "$EXPECTED_ENTRYPOINT"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "$IMAGE")"

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          scope: oresoftware/${{ matrix.image }}@push

      - name: Publish digest-addressable image with SBOM and provenance
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: mode=max

      - name: Record published digest
        if: github.event_name == 'push'
        run: |
          {
            echo '### ${{ matrix.image }}'
            echo
            echo '`${{ steps.publish.outputs.digest }}`'
            echo
            echo 'Deploy by digest only; tags are discovery aliases.'
          } >> "$GITHUB_STEP_SUMMARY"
