name: apply rustfmt once

on:
  push:
    branches:
      - agent/den-392-distributed-assignment-claims

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/den-392-distributed-assignment-claims
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply and publish deterministic formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt [rustfmt applied]'
          git push origin HEAD:agent/den-392-distributed-assignment-claims
