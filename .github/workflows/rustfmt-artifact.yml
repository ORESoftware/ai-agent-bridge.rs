name: rustfmt artifact

on:
  push:
    branches:
      - agent/den-281-workflow-http-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Generate exact rustfmt patch
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- '*.rs' > rustfmt.patch
          test -s rustfmt.patch
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-auth
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1
