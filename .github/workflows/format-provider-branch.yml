name: Format provider branch once

on:
  push:
    branches:
      - agent/den-173-provider-adapters

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/den-173-provider-adapters
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply rustfmt and remove this one-shot workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/providers.rs
          git rm .github/workflows/format-provider-branch.yml
          git commit -m "style: apply rustfmt to provider adapters"
          git push origin HEAD:agent/den-173-provider-adapters
