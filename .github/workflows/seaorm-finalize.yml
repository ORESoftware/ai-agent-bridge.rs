name: seaorm-finalize

on:
  push:
    branches:
      - agent/seaorm-shared-schema-20260804
    paths:
      - ".github/workflows/seaorm-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seaorm-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-cleanup-and-merge:
    if: github.repository == 'ORESoftware/ai-agent-bridge.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bridge
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      DPM_VERSION: 1.4.2
      DPM_SHA256: 42dd9d638a57edbde6c931d776a4ba295bcb2614e498203968c321d84ad90bdb
      FEATURE_BRANCH: agent/seaorm-shared-schema-20260804
      PR_NUMBER: "78"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Require the exact feature branch and current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize immutable shared schema authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/k8s-libs-and-shared-defs
          git init -q vendor/k8s-libs-and-shared-defs
          git -C vendor/k8s-libs-and-shared-defs remote add origin \
            https://github.com/ORESoftware/k8s-libs-and-shared-defs.git
          GIT_TERMINAL_PROMPT=0 git -C vendor/k8s-libs-and-shared-defs fetch \
            --no-tags --depth=1 origin "$EXPECTED_SHARED_COMMIT"
          git -C vendor/k8s-libs-and-shared-defs checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/k8s-libs-and-shared-defs rev-parse HEAD)" = "$EXPECTED_SHARED_COMMIT"
      - name: Install pinned declarative-migrations CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dpm.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/declarative-migrations/declarative-migrations/releases/download/v${DPM_VERSION}/declarative-postgres-migrate-linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DPM_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/declarative-postgres-migrate" "$RUNNER_TEMP/dpm"
      - name: Apply canonical schema and run exact migration suite
        shell: bash
        run: |
          set -euo pipefail
          schema=vendor/k8s-libs-and-shared-defs/pg-defs/schema/schema.sql
          "$RUNNER_TEMP/dpm" apply \
            --database-url "$DATABASE_URL" \
            --schema-file "$schema"
          node --test scripts/seaorm-policy.test.mjs
          EXPECTED_SHARED_COMMIT="$EXPECTED_SHARED_COMMIT" \
            node scripts/check-seaorm-policy.mjs
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features postgres -- -D warnings
          cargo test --locked --all-targets --features postgres
          cargo check --locked --all-targets --features postgres
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
          "$RUNNER_TEMP/dpm" apply \
            --database-url "$DATABASE_URL" \
            --schema-file "$schema"
      - name: Remove only migration-only writer and finalizer workflows
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          git rm -f \
            .github/workflows/seaorm-branch.yml \
            .github/workflows/seaorm-finalize.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/seaorm-branch.yml'
          test "${changed[1]}" = '.github/workflows/seaorm-finalize.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci(postgres): remove migration-only writer and finalizer [skip ci]"
          cleanup_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
      - name: Verify PR head, review threads, and merge the cleanup-only exact head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTED_SHA: ${{ steps.cleanup.outputs.tested_sha }}
          CLEANUP_SHA: ${{ steps.cleanup.outputs.cleanup_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const cleanupSha = process.env.CLEANUP_SHA;
            const testedSha = process.env.TESTED_SHA;

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pull.head.ref !== process.env.FEATURE_BRANCH || pull.base.ref !== 'main') {
              throw new Error(`unexpected PR refs: ${pull.head.ref} -> ${pull.base.ref}`);
            }
            if (pull.head.sha !== cleanupSha) {
              throw new Error(`PR head ${pull.head.sha} does not match cleanup SHA ${cleanupSha}`);
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: testedSha,
              head: cleanupSha,
            });
            const files = (comparison.data.files || []).map(file => file.filename).sort();
            const expected = [
              '.github/workflows/seaorm-branch.yml',
              '.github/workflows/seaorm-finalize.yml',
            ];
            if (JSON.stringify(files) !== JSON.stringify(expected)) {
              throw new Error(`cleanup commit changed unexpected files: ${files.join(', ')}`);
            }

            const query = `query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) {
                  id
                  isDraft
                  reviewThreads(first:100) { nodes { isResolved } }
                }
              }
            }`;
            const result = await github.graphql(query, { owner, repo, number: pullNumber });
            const pr = result.repository.pullRequest;
            const unresolved = pr.reviewThreads.nodes.filter(thread => !thread.isResolved).length;
            if (unresolved !== 0) {
              throw new Error(`${unresolved} unresolved review thread(s) remain`);
            }
            if (pr.isDraft) {
              await github.graphql(
                `mutation($id:ID!) { markPullRequestReadyForReview(input:{pullRequestId:$id}) { pullRequest { id } } }`,
                { id: pr.id },
              );
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              sha: cleanupSha,
              merge_method: 'squash',
              commit_title: 'feat(postgres): finish shared-schema SeaORM migration (#78)',
              commit_message:
                'Replace direct SQLx persistence with SeaORM over the immutable shared k8s schema adapter; apply schema through pinned declarative-migrations; preserve PostgreSQL restart behavior; commit the generated lockfile; and retain read-only exact verification.\n\nNo service-startup DDL or renderer-specific persistence is introduced.',
            });
            if (!merge.data.merged) {
              throw new Error(`merge was not completed: ${merge.data.message}`);
            }
