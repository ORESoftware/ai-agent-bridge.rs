name: sync Rust builder update with current main

on:
  push:
    branches:
      - agent/merge-rust-1.97.1-current-main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/merge-rust-1.97.1-current-main
          fetch-depth: 0
      - name: Merge current main without discarding either side
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-ff --no-edit origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'conflict marker detected after merge' >&2
            exit 1
          fi
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:agent/merge-rust-1.97.1-current-main
