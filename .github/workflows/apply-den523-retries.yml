name: finalize DEN-523 bounded provider retries

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: finalize-den523-retries
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/den-523-bounded-provider-retries'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-523-bounded-provider-retries
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: recursive

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Tighten status policy and validate the clean product branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runner/retry.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn status_may_be_retried(status: u16) -> bool {
              matches!(status, 408 | 409 | 425 | 429) || (500..=599).contains(&status)
          }
          '''
          new = '''fn status_may_be_retried(status: u16) -> bool {
              matches!(status, 408 | 409 | 425 | 429 | 500 | 502 | 503 | 504 | 529)
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one broad server-status allowlist, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked --features postgres
          git diff --check

      - name: Commit the exact policy and remove temporary workflows
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/apply-den523-retries.yml \
            .github/workflows/fix-den523-patch-script.yml
          git add src/runner/retry.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(retry): restrict server retries to reviewed statuses'
          git push origin "HEAD:${HEAD_BRANCH}"
