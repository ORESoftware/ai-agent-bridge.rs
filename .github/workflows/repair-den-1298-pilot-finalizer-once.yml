name: Repair DEN-1298 pilot finalizer once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-den-1298-pilot-finalizer-once.yml'

permissions:
  contents: write

concurrency:
  group: repair-den-1298-pilot-finalizer-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pilot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1298-oresoftware-pilot
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Narrow the gates to the changed Rust target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-den-1298-oresoftware-pilot-once.yml')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'",
                  "if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository",
                  'same-repository finalizer condition',
              ),
              (
                  '              let context = registry.resolve(&request).expect("pilot route must resolve");',
                  '              let context = registry\n                  .resolve(&request)\n                  .expect("pilot route must resolve");',
                  'generated Rust formatting',
              ),
              (
                  '          cargo fmt --all -- --check\n          cargo clippy --all-targets --locked -- -D warnings\n          cargo test --locked --test alex_main_agent_registry',
                  '          rustfmt --edition 2021 --check tests/alex_main_agent_registry.rs\n          cargo clippy --locked --test alex_main_agent_registry -- -D warnings\n          cargo test --locked --test alex_main_agent_registry',
                  'focused Rust validation commands',
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} drifted: expected one match, got {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

          grep -Fq 'rustfmt --edition 2021 --check tests/alex_main_agent_registry.rs' \
            .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml
          ! grep -Fq 'cargo fmt --all -- --check' \
            .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml

      - name: Commit the repaired finalizer and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-den-1298-pilot-finalizer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml
          git diff --cached --check
          git commit -m 'ci(DEN-1298): focus the pilot finalizer on changed targets'
          git push origin HEAD:agent/den-1298-oresoftware-pilot
