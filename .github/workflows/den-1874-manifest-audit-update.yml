name: DEN-1874 update Fanwaave manifest audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/den-1874-manifest-audit-update.yml
      - .github/den-1874-manifest-audit-trigger

permissions:
  contents: write

concurrency:
  group: den-1874-fanwaave-manifest-audit
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/DEN-1874-fanwaave-slack-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/DEN-1874-fanwaave-slack-routing

      - name: Extend the fail-closed audit for Fanwaave
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          audit_path = Path('scripts/audit_alex_main_agent_manifests.py')
          audit = audit_path.read_text(encoding='utf-8')
          audit = replace_once(
              audit,
              'CENTRAL_BINDING_COUNT = PROJECT_COUNT + 1\n',
              'CENTRAL_BINDING_COUNT = PROJECT_COUNT + 2\n',
              'central binding count',
          )
          pilot_constants = '''PILOT_REPOSITORY_ALLOWLIST = (
              "ORESoftware/ai-agent-bridge.rs",
              "ORESoftware/ai-agent-coordinator.rs",
              "ORESoftware/k8s-cluster",
          )
          '''
          fanwaave_constants = pilot_constants + '''FANWAAVE_CHANNEL = "C0BN3FMEJGL"
          FANWAAVE_LINEAR_PROJECT_ID = "d765e227-5726-42c8-8643-a8bd9e5a9a8c"
          FANWAAVE_DEFAULT_REPOSITORY = "fanwaave/push-notification-server.rs"
          FANWAAVE_REPOSITORY_ALLOWLIST = (
              "fanwaave/push-notification-server.rs",
              "fanwaave/.github",
          )
          '''
          audit = replace_once(
              audit,
              pilot_constants,
              fanwaave_constants,
              'Fanwaave constants',
          )
          old_allowlist = '''        expected_allowlist = (
                      list(PILOT_REPOSITORY_ALLOWLIST)
                      if channel == PILOT_CHANNEL
                      else [repo]
                  )
          '''
          new_allowlist = '''        if channel == PILOT_CHANNEL:
                      expected_allowlist = list(PILOT_REPOSITORY_ALLOWLIST)
                  elif channel == FANWAAVE_CHANNEL:
                      expected_allowlist = list(FANWAAVE_REPOSITORY_ALLOWLIST)
                  else:
                      expected_allowlist = [repo]
          '''
          audit = replace_once(
              audit,
              old_allowlist,
              new_allowlist,
              'allowlist selection',
          )
          audit = replace_once(
              audit,
              '    if set(indexed) != project_channels | {PILOT_CHANNEL}:\n',
              '    if set(indexed) != project_channels | {PILOT_CHANNEL, FANWAAVE_CHANNEL}:\n',
              'central channel set',
          )
          pilot_validation = '''    pilot = indexed[PILOT_CHANNEL]
              eq(pilot["linear_project_id"], PILOT_LINEAR_PROJECT_ID, "pilot project UUID")
              eq(pilot["default_repository"], PILOT_DEFAULT_REPOSITORY, "pilot repository")
              eq(pilot["updated_by"], "DEN-1298", "pilot owning issue")
          '''
          fanwaave_validation = pilot_validation + '''    fanwaave = indexed[FANWAAVE_CHANNEL]
              eq(
                  fanwaave["linear_project_id"],
                  FANWAAVE_LINEAR_PROJECT_ID,
                  "Fanwaave project UUID",
              )
              eq(
                  fanwaave["default_repository"],
                  FANWAAVE_DEFAULT_REPOSITORY,
                  "Fanwaave repository",
              )
              eq(fanwaave["updated_by"], "DEN-1874", "Fanwaave owning issue")
          '''
          audit = replace_once(
              audit,
              pilot_validation,
              fanwaave_validation,
              'Fanwaave binding validation',
          )
          audit_path.write_text(audit, encoding='utf-8')

          test_path = Path('tests/test_audit_alex_main_agent_manifests.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '    def test_remote_audit_verifies_thirteen_project_heads_and_pilot_binding(self):\n',
              '    def test_remote_audit_verifies_thirteen_project_heads_and_two_reviewed_bindings(self):\n',
              'remote audit test name',
          )
          tests = replace_once(
              tests,
              '        self.assertEqual(report["central_registry"]["bindings"], 14)\n',
              '        self.assertEqual(report["central_registry"]["bindings"], 15)\n',
              'reported binding count',
          )
          tests = replace_once(
              tests,
              '    def test_pilot_binding_is_excluded_from_project_manifest_digest(self):\n',
              '    def test_non_manifest_bindings_are_excluded_from_project_manifest_digest(self):\n',
              'digest test name',
          )
          tests = replace_once(
              tests,
              '            manifest_audit.AuditError, "expected 14 central bindings"\n',
              '            manifest_audit.AuditError, "expected 15 central bindings"\n',
              'missing pilot expectation',
          )
          insertion_marker = '''    def test_pilot_repository_allowlist_drift_fails_closed(self):
          '''
          fanwaave_tests = '''    def test_missing_fanwaave_binding_fails_closed(self):
                  registry = copy.deepcopy(self.registry)
                  registry["bindings"] = [
                      binding
                      for binding in registry["bindings"]
                      if binding["channel_id"] != manifest_audit.FANWAAVE_CHANNEL
                  ]
                  with self.assertRaisesRegex(
                      manifest_audit.AuditError, "expected 15 central bindings"
                  ):
                      self._audit(registry=registry)

              def test_fanwaave_repository_allowlist_drift_fails_closed(self):
                  registry = copy.deepcopy(self.registry)
                  fanwaave = next(
                      binding
                      for binding in registry["bindings"]
                      if binding["channel_id"] == manifest_audit.FANWAAVE_CHANNEL
                  )
                  fanwaave["repository_allowlist"].append("ORESoftware/k8s-cluster")
                  with self.assertRaisesRegex(manifest_audit.AuditError, "contract_mismatch"):
                      self._audit(registry=registry)

          '''
          tests = replace_once(
              tests,
              insertion_marker,
              fanwaave_tests + insertion_marker,
              'Fanwaave audit tests',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the complete audit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/audit_alex_main_agent_manifests.py \
            tests/test_audit_alex_main_agent_manifests.py
          python3 -m unittest -v tests/test_audit_alex_main_agent_manifests.py
          cargo fmt --all -- --check

      - name: Commit the validated audit update and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/den-1874-manifest-audit-update.yml \
            .github/den-1874-manifest-audit-trigger
          git add \
            scripts/audit_alex_main_agent_manifests.py \
            tests/test_audit_alex_main_agent_manifests.py
          git diff --cached --check
          git commit -m 'DEN-1874 audit the Fanwaave bridge binding'
          git push origin HEAD:agent/DEN-1874-fanwaave-slack-routing
