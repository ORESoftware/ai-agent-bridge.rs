name: DEN-1874 Fanwaave Slack routing migration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/den-1874-fanwaave-slack-routing.yml
      - .github/den-1874-fanwaave-routing-trigger

permissions:
  contents: write

concurrency:
  group: den-1874-fanwaave-slack-routing
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/DEN-1874-fanwaave-slack-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/DEN-1874-fanwaave-slack-routing

      - name: Add the fail-closed Fanwaave binding
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          registry_path = Path("config/alex-main-agent.channels.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          bindings = registry["bindings"]

          workspace_id = "T01B3C83PMK"
          channel_id = "C0BN3FMEJGL"
          linear_project_id = "d765e227-5726-42c8-8643-a8bd9e5a9a8c"
          repositories = [
              "fanwaave/push-notification-server.rs",
              "fanwaave/.github",
          ]

          if any(
              binding["workspace_id"] == workspace_id
              and binding["channel_id"] == channel_id
              for binding in bindings
          ):
              raise SystemExit("Fanwaave Slack binding already exists")
          if any(
              repository.casefold()
              in {
                  configured.casefold()
                  for configured in binding["repository_allowlist"]
              }
              for binding in bindings
              for repository in repositories
          ):
              raise SystemExit("Fanwaave repository is already routed by another channel")

          bindings.append(
              {
                  "workspace_id": workspace_id,
                  "channel_id": channel_id,
                  "linear_team_id": "eb8ab169-5afe-4b6f-9cab-3f2aa3e887dc",
                  "linear_team_key": "DEN",
                  "linear_project_id": linear_project_id,
                  "default_repository": repositories[0],
                  "repository_allowlist": repositories,
                  "default_agent_mode": "both-parallel",
                  "allowed_agent_modes": [
                      "claude",
                      "chatgpt",
                      "both-parallel",
                      "both-sequential",
                      "review",
                  ],
                  "allowed_user_ids": ["U01AZNU2LJ2"],
                  "allowed_user_group_ids": [],
                  "write_policy": "draft_pull_request",
                  "budget_policy": {
                      "max_concurrent_runs": 2,
                      "max_runtime_secs": 900,
                      "max_tokens": 250000,
                      "max_spend_cents": 1000,
                      "max_retries": 2,
                  },
                  "updated_by": "DEN-1874",
                  "updated_at": "2026-08-08T00:00:00Z",
              }
          )

          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/alex_main_agent_registry.rs")
          tests = test_path.read_text(encoding="utf-8")
          old_count = "    assert_eq!(registry.binding_count(), 14);"
          new_count = "    assert_eq!(registry.binding_count(), 15);"
          if tests.count(old_count) != 1:
              raise SystemExit("expected exactly one binding-count assertion")
          tests = tests.replace(old_count, new_count, 1)

          marker = "#[test]\nfn unauthorized_user_cannot_dispatch_repository_work()"
          fanwaave_test = '''#[test]
          fn fanwaave_routes_only_reviewed_repositories_as_draft_pull_requests() {
              let registry = SlackProjectRegistry::from_json(REGISTRY).expect("registry must be valid");
              let mut request = request("C0BN3FMEJGL", ALEX_USER_ID);
              request.linear_issue_identifier = Some("DEN-1874".to_string());

              let default_context = registry.resolve(&request).expect("Fanwaave route must resolve");
              assert_eq!(default_context.linear_team_key, "DEN");
              assert_eq!(
                  default_context.linear_project_id,
                  "d765e227-5726-42c8-8643-a8bd9e5a9a8c"
              );
              assert_eq!(
                  default_context.repository,
                  "fanwaave/push-notification-server.rs"
              );
              assert_eq!(default_context.write_policy, WritePolicy::DraftPullRequest);

              request.requested_repository = Some("fanwaave/.github".to_string());
              let governance_context = registry
                  .resolve(&request)
                  .expect("Fanwaave governance route must resolve");
              assert_eq!(governance_context.repository, "fanwaave/.github");

              request.requested_repository = Some("ORESoftware/k8s-cluster".to_string());
              assert!(matches!(
                  registry.resolve(&request),
                  Err(RegistryError::RepositoryNotAllowed)
              ));
          }

          '''
          if tests.count(marker) != 1:
              raise SystemExit("could not locate test insertion point")
          tests = tests.replace(marker, fanwaave_test + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate the migration payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/alex-main-agent.channels.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("config/alex-main-agent.channels.json").read_text())
          matches = [
              binding
              for binding in registry["bindings"]
              if binding["workspace_id"] == "T01B3C83PMK"
              and binding["channel_id"] == "C0BN3FMEJGL"
          ]
          assert len(matches) == 1
          binding = matches[0]
          assert binding["linear_project_id"] == "d765e227-5726-42c8-8643-a8bd9e5a9a8c"
          assert binding["default_repository"] == "fanwaave/push-notification-server.rs"
          assert binding["repository_allowlist"] == [
              "fanwaave/push-notification-server.rs",
              "fanwaave/.github",
          ]
          assert binding["write_policy"] == "draft_pull_request"
          assert binding["allowed_user_ids"] == ["U01AZNU2LJ2"]
          PY
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Commit the validated binding and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/den-1874-fanwaave-slack-routing.yml \
            .github/den-1874-fanwaave-routing-trigger
          git add \
            config/alex-main-agent.channels.json \
            tests/alex_main_agent_registry.rs
          git diff --cached --check
          git commit -m "DEN-1874 route Fanwaave through the agent bridge"
          git push origin HEAD:agent/DEN-1874-fanwaave-slack-routing
