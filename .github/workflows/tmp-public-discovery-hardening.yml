name: Temporary public discovery hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-public-discovery-hardening.yml

permissions:
  contents: write

concurrency:
  group: temporary-public-discovery-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply and format exact hardening patch
        run: |
          python3 scripts/tmp-public-discovery-hardening.py
          cargo fmt --manifest-path sdk/agent-pontifex-sdk/Cargo.toml
          rustfmt --edition 2021 src/main.rs src/workflow_security/middleware.rs

      - name: Validate SDK and outer bridge layers
        run: |
          cargo clippy --manifest-path sdk/agent-pontifex-sdk/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path sdk/agent-pontifex-sdk/Cargo.toml
          mkdir -p vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm/src
          cat > vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm/Cargo.toml <<'EOF'
          [package]
          name = "dd-pg-defs-sea-orm"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          EOF
          : > vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm/src/lib.rs
          cargo check --lib --no-default-features
          cargo test --lib --no-default-features agent_pontifex_discovery_is_public
          rm -rf vendor/k8s-libs-and-shared-defs
          git checkout -- Cargo.lock

      - name: Verify exact scope and remove temporary script
        run: |
          rm scripts/tmp-public-discovery-hardening.py
          git diff --check
          git status --short

      - name: Commit reviewed code hardening
        env:
          BRANCH_NAME: agent/shared-protocol-sdk-foundation
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$TRIGGER_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/tmp-public-discovery-hardening.py \
            sdk/agent-pontifex-sdk/src/lib.rs \
            src/main.rs \
            src/workflow_security/middleware.rs
          git commit -m "fix: keep Agent Pontifex discovery public end to end"
          git push origin "HEAD:$BRANCH_NAME"
