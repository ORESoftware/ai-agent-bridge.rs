name: refresh credential-free lock once

on:
  push:
    branches:
      - agent/DEN-1298-credential-free-browser-ci
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-credential-free-lock-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ORESoftware/ai-agent-bridge.rs' && github.ref == 'refs/heads/agent/DEN-1298-credential-free-browser-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/DEN-1298-credential-free-browser-ci
          persist-credentials: true
          submodules: false

      - name: Materialize exact optional metadata
        run: bash scripts/materialize-optional-seaorm-metadata.sh

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Refresh and publish only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          test "${changed}" = "Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lock for current shared-schema metadata"
          git push origin HEAD:agent/DEN-1298-credential-free-browser-ci
