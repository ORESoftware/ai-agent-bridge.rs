name: apply DEN-392 scoped context repair

on:
  push:
    branches:
      - fix/den-392-semantic-context-integration

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/den-392-semantic-context-integration
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Route reserved workflow state through crate-internal APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {count}")
              file.write_text(text.replace(old, new, expected))

          replace_exact(
              "src/assignment_claims.rs",
              ".get_context_key(&channel, PLAN_CONTEXT_KEY)?",
              ".get_context_key_internal(&channel, PLAN_CONTEXT_KEY)?",
          )
          replace_exact(
              "src/policy_admission/storage.rs",
              ".get_context_key(&channel, WORKFLOW_PLAN_CONTEXT_KEY)?",
              ".get_context_key_internal(&channel, WORKFLOW_PLAN_CONTEXT_KEY)?",
          )
          replace_exact(
              "src/policy_admission/storage.rs",
              ".get_context_key(&channel, ADMISSION_CONTEXT_KEY)?",
              ".get_context_key_internal(&channel, ADMISSION_CONTEXT_KEY)?",
          )
          replace_exact(
              "src/policy_admission/storage.rs",
              "state.set_context(\n",
              "state.set_context_internal(\n",
          )
          replace_exact(
              "src/policy_admission/tests.rs",
              ".set_context(\n",
              ".set_context_internal(\n",
          )

          for path, forbidden in {
              "src/assignment_claims.rs": [".get_context_key(&channel, PLAN_CONTEXT_KEY)"],
              "src/policy_admission/storage.rs": [
                  ".get_context_key(&channel, WORKFLOW_PLAN_CONTEXT_KEY)",
                  ".get_context_key(&channel, ADMISSION_CONTEXT_KEY)",
                  "state.set_context(\n",
              ],
              "src/policy_admission/tests.rs": [".set_context(\n"],
          }.items():
              text = Path(path).read_text()
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"{path}: stale external context access remains: {marker!r}")
          PY
          cargo fmt --all
          rm -f .github/workflows/agent-semantic-merge-den-392.yml
          rm .github/workflows/agent-fix-den-392-context.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve scoped context security in DEN-392 stack'
          git push origin HEAD:fix/den-392-semantic-context-integration
