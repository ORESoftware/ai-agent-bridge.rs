name: Slack ingress browser security

on:
  pull_request:
    paths:
      - .github/workflows/slack-ingress-browser-security.yml
      - .gitmodules
      - Cargo.lock
      - Cargo.toml
      - config/alex-main-agent.channels.json
      - scripts/ci/prepare-credential-free-build.sh
      - scripts/ci/fixtures/dd-pg-defs-sea-orm/**
      - slack-app/manifest.yaml
      - src/bin/fiducia-slack-command.rs
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - tests/browser/**
  push:
    branches: [main]
    paths:
      - .github/workflows/slack-ingress-browser-security.yml
      - .gitmodules
      - Cargo.lock
      - Cargo.toml
      - config/alex-main-agent.channels.json
      - scripts/ci/prepare-credential-free-build.sh
      - scripts/ci/fixtures/dd-pg-defs-sea-orm/**
      - slack-app/manifest.yaml
      - src/bin/fiducia-slack-command.rs
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - tests/browser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHARED_COMMIT: e76b23cb2e23782438a3b03dacc26adfab1bb7fb
      SLACK_COMMAND_BASE_URL: http://127.0.0.1:8151
      SLACK_COMMAND_HOST: 127.0.0.1
      SLACK_COMMAND_PORT: "8151"
      SLACK_SIGNING_SECRET: browser-test-signing-secret
      SLACK_BOT_TOKEN: browser-test-bot-token
      SLACK_PROJECT_REGISTRY_PATH: ${{ github.workspace }}/config/alex-main-agent.channels.json
      SLACK_API_BASE_URL: http://127.0.0.1:8170/api/
      SLACK_EXPECTED_APP_ID: A0BMBAMM5NJ
      SLACK_EXPECTED_TEAM_ID: T01B3C83PMK
      SLACK_COMMAND_DRY_RUN: "true"
      SLACK_COMMAND_MAX_CONCURRENT_RUNS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare credential-free build inputs
        run: bash scripts/ci/prepare-credential-free-build.sh

      - name: Initialize private evidence directories
        run: |
          set -euo pipefail
          umask 077

          playwright_output_dir="${RUNNER_TEMP}/slack-command-browser-results"
          slack_command_log_dir="${RUNNER_TEMP}/slack-command-browser-logs"
          slack_command_state_dir="${RUNNER_TEMP}/slack-command-state"

          mkdir -p \
            "${playwright_output_dir}" \
            "${slack_command_log_dir}" \
            "${slack_command_state_dir}"
          chmod 700 \
            "${playwright_output_dir}" \
            "${slack_command_log_dir}" \
            "${slack_command_state_dir}"

          {
            printf 'PLAYWRIGHT_OUTPUT_DIR=%s\n' "${playwright_output_dir}"
            printf 'SLACK_COMMAND_LOG_DIR=%s\n' "${slack_command_log_dir}"
            printf 'SLACK_COMMAND_STATE_DIR=%s\n' "${slack_command_state_dir}"
          } >>"${GITHUB_ENV}"

          jq -n \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt}' \
            >"${playwright_output_dir}/initialized.json"

      - name: Validate focused workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/slack-ingress-browser-security.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Build the production Slack command service
        run: cargo build --locked --bin fiducia-slack-command

      - name: Install pinned browser dependency
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise signed-ingress rejection boundaries in Chromium
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          service_log="${SLACK_COMMAND_LOG_DIR}/fiducia-slack-command.log"
          readiness_json="${PLAYWRIGHT_OUTPUT_DIR}/readiness.json"

          target/debug/fiducia-slack-command >"${service_log}" 2>&1 &
          service_pid=$!

          cleanup() {
            status=$?
            kill "${service_pid}" 2>/dev/null || true
            wait "${service_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${service_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${SLACK_COMMAND_BASE_URL}/readyz" >"${readiness_json}"; then
              ready=1
              break
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat "${service_log}"
            exit 1
          fi

          jq -e '
            .ok == true and
            .dry_run == true and
            .installed_app_identity_enforced == true
          ' "${readiness_json}"

          timeout 2m npm --prefix tests/browser run test:slack-ingress \
            2>&1 | tee "${PLAYWRIGHT_OUTPUT_DIR}/playwright.tap"

          if find "${SLACK_COMMAND_STATE_DIR}" -mindepth 1 -print -quit | grep -q .; then
            echo "Rejected ingress requests unexpectedly created a run-journal claim" >&2
            find "${SLACK_COMMAND_STATE_DIR}" -mindepth 1 -maxdepth 1 -printf '%f\n' >&2
            exit 1
          fi

          head_sha="$(jq --raw-output '.pull_request.head.sha // .after // empty' "${GITHUB_EVENT_PATH}")"
          if [ -z "${head_sha}" ]; then
            head_sha="${GITHUB_SHA}"
          fi
          jq -n \
            --arg head_sha "${head_sha}" \
            --arg tested_commit "${GITHUB_SHA}" \
            --arg service "fiducia-slack-command" \
            '{
              schema_version: 1,
              head_sha: $head_sha,
              tested_commit: $tested_commit,
              service: $service,
              live_external_credentials: false,
              rejected_run_claim_count: 0
            }' >"${PLAYWRIGHT_OUTPUT_DIR}/evidence.json"

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## Slack signed-ingress browser security'
            echo
            echo "- Tested commit: \`${GITHUB_SHA}\`"
            echo "- Run attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Evidence artifact: \`slack-ingress-browser-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized browser evidence and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slack-ingress-browser-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/slack-command-browser-results
            ${{ runner.temp }}/slack-command-browser-logs
          if-no-files-found: error
          retention-days: 14
