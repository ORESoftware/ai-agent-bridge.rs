name: Slack ingress browser security

on:
  pull_request:
    paths:
      - .github/workflows/slack-ingress-browser-security.yml
      - Cargo.lock
      - Cargo.toml
      - config/alex-main-agent.channels.json
      - slack-app/manifest.yaml
      - src/bin/fiducia-slack-command.rs
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - tests/browser/**
  push:
    branches: [main]
    paths:
      - .github/workflows/slack-ingress-browser-security.yml
      - Cargo.lock
      - Cargo.toml
      - config/alex-main-agent.channels.json
      - slack-app/manifest.yaml
      - src/bin/fiducia-slack-command.rs
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - tests/browser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLACK_COMMAND_BASE_URL: http://127.0.0.1:8151
      SLACK_COMMAND_HOST: 127.0.0.1
      SLACK_COMMAND_PORT: "8151"
      SLACK_SIGNING_SECRET: browser-test-signing-secret
      SLACK_BOT_TOKEN: browser-test-bot-token
      SLACK_PROJECT_REGISTRY_PATH: ${{ github.workspace }}/config/alex-main-agent.channels.json
      SLACK_COMMAND_STATE_DIR: ${{ runner.temp }}/slack-command-state
      SLACK_API_BASE_URL: http://127.0.0.1:8170/api/
      SLACK_EXPECTED_APP_ID: A0BMBAMM5NJ
      SLACK_EXPECTED_TEAM_ID: T01B3C83PMK
      SLACK_COMMAND_DRY_RUN: "true"
      SLACK_COMMAND_MAX_CONCURRENT_RUNS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate focused workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/slack-ingress-browser-security.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Build the production Slack command service
        run: cargo build --locked --bin fiducia-slack-command

      - name: Install pinned browser dependency
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Exercise signed-ingress rejection boundaries in Chromium
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "${SLACK_COMMAND_STATE_DIR}"
          service_log="${RUNNER_TEMP}/fiducia-slack-command.log"
          readiness_json="${RUNNER_TEMP}/fiducia-slack-command-ready.json"

          target/debug/fiducia-slack-command >"${service_log}" 2>&1 &
          service_pid=$!

          cleanup() {
            status=$?
            kill "${service_pid}" 2>/dev/null || true
            wait "${service_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${service_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${SLACK_COMMAND_BASE_URL}/readyz" >"${readiness_json}"; then
              ready=1
              break
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat "${service_log}"
            exit 1
          fi

          jq -e '
            .ok == true and
            .dry_run == true and
            .installed_app_identity_enforced == true
          ' "${readiness_json}"

          timeout 2m npm --prefix tests/browser run test:slack-ingress
