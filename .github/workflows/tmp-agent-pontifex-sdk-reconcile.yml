name: Temporary Agent Pontifex SDK reconciliation

on:
  push:
    branches:
      - agent/shared-protocol-sdk-foundation
    paths:
      - .github/workflows/tmp-agent-pontifex-sdk-reconcile.yml

permissions:
  contents: write

concurrency:
  group: temporary-agent-pontifex-sdk-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Apply exact reconciliation and format changed Rust
        run: |
          python3 scripts/tmp-reconcile-agent-pontifex-sdk.py
          cargo fmt --manifest-path sdk/agent-pontifex-protocol/Cargo.toml
          cargo fmt --manifest-path sdk/agent-pontifex-sdk/Cargo.toml
          rustfmt --edition 2021 src/http.rs

      - name: Verify exact scope and remove temporary machinery
        run: |
          rm scripts/tmp-reconcile-agent-pontifex-sdk.py
          rm .github/workflows/tmp-agent-pontifex-sdk-reconcile.yml
          git diff --check
          git status --short

      - name: Commit reviewed reconciliation
        env:
          BRANCH_NAME: agent/shared-protocol-sdk-foundation
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$TRIGGER_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/agent-pontifex-sdk.yml \
            .github/workflows/tmp-agent-pontifex-sdk-reconcile.yml \
            scripts/tmp-reconcile-agent-pontifex-sdk.py \
            sdk/README.md \
            sdk/agent-pontifex-protocol/src/lib.rs \
            sdk/agent-pontifex-sdk/src/lib.rs \
            src/http.rs
          git commit -m "feat(sdk): negotiate and expose Agent Pontifex discovery"
          git push origin "HEAD:$BRANCH_NAME"
