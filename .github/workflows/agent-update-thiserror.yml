name: update thiserror on current main

on:
  push:
    branches:
      - agent/merge-thiserror-2.0.19-current-main

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/merge-thiserror-2.0.19-current-main
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Regenerate only the reviewed thiserror graph
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p thiserror@2.0.18 --precise 2.0.19
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          by_name_version = {(p['name'], p['version']): p for p in packages}
          thiserror = by_name_version[('thiserror', '2.0.19')]
          impl = by_name_version[('thiserror-impl', '2.0.19')]
          syn3 = by_name_version[('syn', '3.0.3')]
          assert thiserror['checksum'] == '09a43598840e33d5b0331f38c5e30d13bb11c11210a4b58f0d9b18a5a5eefcd9'
          assert impl['checksum'] == '43cbfe0cf76104d42a574802844187e84a305e531ed54455f11fbde0f10541cd'
          assert syn3['checksum'] == '53e9bae58849f64dfa4f5d5ae372c8341f7305f82a3868709269343628b659a3'
          assert ('thiserror', '2.0.18') not in by_name_version
          assert ('thiserror-impl', '2.0.18') not in by_name_version
          PY
          changed="$(git diff --name-only)"
          test "$changed" = 'Cargo.lock'
          git diff --check
      - name: Canonical Rust and persistence validation
        shell: bash
        env:
          FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo check --all-targets --locked --features postgres
          cargo test --locked --features postgres --test postgres_restart -- --ignored
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7
        with:
          tool: cargo-audit@0.22.2
      - name: Audit and commit validated graph
        shell: bash
        run: |
          set -euo pipefail
          cargo audit
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
          rm .github/workflows/agent-update-thiserror.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/agent-update-thiserror.yml
          git commit -m 'chore(deps): update thiserror to 2.0.19'
          git push origin HEAD:agent/merge-thiserror-2.0.19-current-main
