name: DEN-524 integration marker diagnostic

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/den524-marker-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/den-524-tcp-scoped-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Count integration markers
        run: |
          python - <<'PY' > markers.txt
          from pathlib import Path
          checks = {
              'state_set': ('src/state.rs', '    pub fn set_context(\n'),
              'state_get': ('src/state.rs', '    pub fn get_context(&self, slug: &str) -> BridgeResult<Vec<ContextEntry>> {\n'),
              'state_get_key': ('src/state.rs', '    pub fn get_context_key(&self, slug: &str, key: &str) -> BridgeResult<Option<ContextEntry>> {\n'),
              'main_auth': ('src/main.rs', '    let workflow_auth = workflow_security::WorkflowSecurity::from_env(\n        config.api_auth_bearer.clone(),\n        config.max_http_body_bytes,\n    )?;\n'),
              'main_tcp_serve': ('src/main.rs', 'tcp::serve(tcp_state, tcp_listener).await'),
              'tcp_import': ('src/tcp.rs', 'use crate::state::AppState;\n'),
              'tcp_serve': ('src/tcp.rs', 'pub async fn serve(state: Arc<AppState>, listener: TcpListener) -> anyhow::Result<()> {'),
              'tcp_spawn': ('src/tcp.rs', '        let state = state.clone();\n        tokio::spawn(async move {\n            let _permit = permit; // released when the connection ends\n            if let Err(e) = handle_conn(state, socket).await {\n'),
              'tcp_handle': ('src/tcp.rs', 'async fn handle_conn(state: Arc<AppState>, socket: TcpStream) -> anyhow::Result<()> {'),
              'tcp_authed': ('src/tcp.rs', '    let mut authed = state.config.api_auth_bearer.is_none();\n'),
              'tcp_hello': ('src/tcp.rs', '&json!({ "ok": true, "hello": "ai-agent-bridge", "needs_auth": !authed, "max_members": crate::config::MAX_MEMBERS }),'),
              'tcp_auth_block': ('src/tcp.rs', '        if let Req::Auth { token } = &req {\n            authed = match state.config.api_auth_bearer.as_deref() {\n'),
              'tcp_dispatch': ('src/tcp.rs', '        let response = dispatch(&state, &writer, req, &mut sub_tasks, &mut subscribed).await;\n'),
              'tcp_req': ('src/tcp.rs', 'enum Req {'),
          }
          for name, (path, marker) in checks.items():
              text = Path(path).read_text()
              print(f'{name}={text.count(marker)}')
          PY
          cat markers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: den524-markers
          path: markers.txt
          retention-days: 1
          if-no-files-found: error
