name: DEN-766 prepare review branch

on:
  push:
    branches:
      - agent/den-766-slack-dual-model-router
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: den-766-prepare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.repository == 'ORESoftware/ai-agent-bridge.rs' &&
      ((github.event_name == 'push' && github.ref_name == 'agent/den-766-slack-dual-model-router') ||
       (github.event_name == 'pull_request' && github.head_ref == 'agent/den-766-slack-dual-model-router' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Verify and install the reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/den-766-payload/fix00 \
            .github/den-766-payload/fix01 \
            .github/den-766-payload/fix02a \
            .github/den-766-payload/fix02b \
            .github/den-766-payload/fix02c \
            .github/den-766-payload/fix02d \
            .github/den-766-payload/fix03 \
            .github/den-766-payload/part01 \
            .github/den-766-payload/part02 \
            .github/den-766-payload/part03 \
            > /tmp/den-766-payload.b64
          base64 --decode /tmp/den-766-payload.b64 > /tmp/den-766-payload.tar.gz
          echo '122c21161981d8df6d060ae49cb6b2421aae88bfaf16073fcee5142854d8e02b  /tmp/den-766-payload.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/den-766-payload.tar.gz --directory .
          # DEN-766 is source-only and explicitly does not activate deployment.
          # Keep the pre-existing image workflow untouched so the Actions token
          # does not need the separate workflows permission.
          git restore --source=HEAD -- .github/workflows/container-images.yml
          rm -rf .github/den-766-payload
          rm -f .github/den-766-trigger
          rm -f .github/workflows/den-766-prepare.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Format and validate without write credentials
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo fmt --all || status=$?
          if [ "$status" -eq 0 ]; then
            cargo clippy --all-targets --features postgres -- -D warnings || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --all-targets || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo check --all-targets --features postgres || status=$?
          fi
          git diff --check || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit the normalized review diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add authenticated Slack dual-model router'

      - name: Push the review commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Report validation result
        shell: bash
        run: exit '${{ steps.validate.outputs.status }}'
