# CI pipeline: secret hygiene, formatting, clippy (warnings as errors), tests,
# canonical-schema Postgres durability, browser automation, and flags-2-env audits.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      DPM_INSTALLER_COMMIT: f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc
      FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
      SHADOW_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            ./.github/workflows/ci.yml
            ./.github/workflows/slack-ingress-browser-security.yml
      - name: Audit provider credential hygiene
        run: python3 scripts/audit-provider-secrets.py
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Validate shared schema and SeaORM policy
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/seaorm-policy.test.mjs
          node scripts/check-seaorm-policy.mjs
      - name: Install pinned declarative migration tool
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/declarative-migrations/declarative-postgres-migrate.rs/${DPM_INSTALLER_COMMIT}/scripts/install.sh" \
            | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provision disposable Postgres through DPM bootstrap
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          vendor/k8s-libs-and-shared-defs/pg-defs/scripts/dpm.sh bootstrap \
            > "${RUNNER_TEMP}/canonical-schema.sql"
          psql "$FIDUCIA_BRIDGE_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f "${RUNNER_TEMP}/canonical-schema.sql"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --features postgres -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo check --all-targets --locked --features postgres
      - name: Test PostgreSQL restart durability
        run: cargo test --locked --features postgres --test postgres_restart -- --ignored
      - name: Reject direct SQLx and boot-migration paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
      - run: make -B -C vendor/flags-2-env all
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml

  browser-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Verify Node runtime
        run: |
          node --version
          npm --version
      - name: Build loopback registry probe
        run: cargo build --locked --bin alex-main-agent-registry-browser
      - name: Install pinned browser test dependency
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Exercise registry policy through Chromium
        env:
          ALEX_MAIN_AGENT_PROBE_ADDR: 127.0.0.1:8160
          ALEX_MAIN_AGENT_PROBE_URL: http://127.0.0.1:8160
          ALEX_MAIN_AGENT_REGISTRY_PATH: ${{ github.workspace }}/config/alex-main-agent.channels.json
        run: |
          set -euo pipefail
          probe_log="${RUNNER_TEMP}/alex-main-agent-registry-probe.log"
          health_json="${RUNNER_TEMP}/alex-main-agent-health.json"

          target/debug/alex-main-agent-registry-browser >"${probe_log}" 2>&1 &
          probe_pid=$!
          cleanup() {
            status=$?
            kill "${probe_pid}" 2>/dev/null || true
            wait "${probe_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${probe_log}"
            fi
            return "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${ALEX_MAIN_AGENT_PROBE_URL}/healthz" >"${health_json}"; then
              ready=1
              break
            fi
            if ! kill -0 "${probe_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat "${probe_log}"
            exit 1
          fi
          grep --fixed-strings '"bindings":13' "${health_json}"
          npm --prefix tests/browser test

  static-checks:
    # Validations that need neither Cargo nor the private vendor/ submodules.
    # The cargo jobs (test, browser-registry) structurally cannot run on PR branches
    # until DEN-2802 is resolved, because Cargo requires the optional
    # `dd-pg-defs-sea-orm` path dependency to exist even when its feature is off.
    # This job keeps real PR signal for the checks that do not have that constraint.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            ./.github/workflows/ci.yml
            ./.github/workflows/slack-ingress-browser-security.yml
      - name: Audit provider credential hygiene
        run: python3 scripts/audit-provider-secrets.py
      - name: Reject direct SQLx and boot-migration paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
