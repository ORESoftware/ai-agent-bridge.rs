# CI pipeline: formatting, clippy (warnings as errors), tests, a postgres-feature
# check, and a flags-2-env config audit, on every PR and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo check --all-targets --locked --features postgres
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml
