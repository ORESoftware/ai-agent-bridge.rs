# Credential-free CI for the bridge, runner, Slack ingress, routing registry,
# provider hygiene, browser automation, and flags-2-env contracts.
#
# Private shared-schema/Postgres certification is intentionally centralized in
# ORESoftware/k8s-cluster behind its reviewed GitHub App boundary.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/den-1227-runner-prometheus-metrics

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare credential-free build inputs
        run: bash scripts/ci/prepare-credential-free-build.sh

      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            ./.github/workflows/ci.yml
            ./.github/workflows/container-images.yml
            ./.github/workflows/slack-ingress-browser-security.yml
            ./.github/workflows/slack-bridge-events-browser-security.yml

      - name: Audit provider credential hygiene
        run: python3 scripts/audit-provider-secrets.py

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Validate the exact shared-schema pin and policy parsers
        shell: bash
        run: |
          set -euo pipefail

          # config/shared-schema-pin is the single source of truth. It used to be
          # duplicated across seven workflow sites, and three separate vendor
          # bumps moved the gitlink without updating them, taking every
          # credential-free lane down until someone re-baselined by hand. Fail
          # here if a literal is reintroduced anywhere, so the duplication cannot
          # come back quietly.
          if grep -rnE 'EXPECTED_SHARED_COMMIT[=:][[:space:]]*[0-9a-f]{40}' \
            .github/workflows scripts; then
            echo "Hardcoded shared-schema pin found; use config/shared-schema-pin" >&2
            exit 1
          fi

          pinned_shared_commit="$(git ls-tree HEAD -- vendor/k8s-libs-and-shared-defs | awk '$2 == "commit" { print $3 }')"
          if [ "${pinned_shared_commit}" != "${EXPECTED_SHARED_COMMIT}" ]; then
            echo "vendor/k8s-libs-and-shared-defs is pinned at ${pinned_shared_commit}," >&2
            echo "but config/shared-schema-pin expects ${EXPECTED_SHARED_COMMIT}." >&2
            echo "Update config/shared-schema-pin in the same PR as the gitlink bump." >&2
            exit 1
          fi
          node --test \
            scripts/seaorm-policy.test.mjs \
            scripts/container-images-policy.test.mjs

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint credential-free targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test credential-free targets
        run: cargo test --all-targets --locked

      - name: Check credential-free targets
        run: cargo check --all-targets --locked

      - name: Prove the placeholder cannot certify Postgres
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/postgres-placeholder-check.log"
          if cargo check --locked --features postgres >"${log}" 2>&1; then
            echo "postgres unexpectedly compiled with the credential-free placeholder" >&2
            exit 1
          fi
          grep -F \
            'the credential-free dd-pg-defs-sea-orm placeholder was compiled' \
            "${log}"

      - name: Reject direct SQLx and boot-migration paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests

      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit@0.22.2

      - run: cargo audit
      - run: make -B -C vendor/flags-2-env all
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml

  integrate-runner-metrics:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'agent/den-1227-runner-prometheus-metrics' &&
      github.event.head_commit.message == 'chore(ci): trigger DEN-1227 integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: recursive

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply lifecycle instrumentation
        run: python3 scripts/ci/apply-den1227-runner-metrics.py

      - name: Add full health-listener endpoint coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runner_health.rs')
          text = path.read_text(encoding='utf-8')
          marker = '''        assert_eq!(live.status(), StatusCode::OK);

        let not_ready = client
          '''
          replacement = '''        assert_eq!(live.status(), StatusCode::OK);

        let metrics = client
            .get(format!("http://{address}/metrics"))
            .send()
            .await
            .unwrap();
        assert_eq!(metrics.status(), StatusCode::OK);
        assert!(metrics
            .headers()
            .get(header::CONTENT_TYPE)
            .and_then(|value| value.to_str().ok())
            .is_some_and(|value| value.starts_with("text/plain")));
        let metrics = metrics.text().await.unwrap();
        assert!(metrics.contains("ai_agent_runner_build_info"));
        assert!(metrics.contains("ai_agent_runner_ready 0"));

        let not_ready = client
          '''
          if text.count(marker) != 1:
              raise SystemExit('runner health HTTP test marker missing or duplicated')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Validate Rust runner metrics and durability contracts
        env:
          FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo test --all-targets --locked --features postgres
          cargo test --locked --features postgres --test postgres_restart -- --ignored
          git diff --check

      - name: Commit validated product code
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add src tests docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(runner-metrics): expose bounded provider-runner metrics'
          git push origin "HEAD:${HEAD_BRANCH}"

  browser-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare credential-free build inputs
        run: bash scripts/ci/prepare-credential-free-build.sh

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Build loopback registry probe
        run: cargo build --locked --bin alex-main-agent-registry-browser

      - name: Install pinned browser test dependency
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Exercise registry policy through Chromium
        env:
          ALEX_MAIN_AGENT_PROBE_ADDR: 127.0.0.1:8160
          ALEX_MAIN_AGENT_PROBE_URL: http://127.0.0.1:8160
          ALEX_MAIN_AGENT_REGISTRY_PATH: ${{ github.workspace }}/config/alex-main-agent.channels.json
        run: |
          set -euo pipefail
          probe_log="${RUNNER_TEMP}/alex-main-agent-registry-probe.log"
          health_json="${RUNNER_TEMP}/alex-main-agent-health.json"

          target/debug/alex-main-agent-registry-browser >"${probe_log}" 2>&1 &
          probe_pid=$!
          cleanup() {
            status=$?
            kill "${probe_pid}" 2>/dev/null || true
            wait "${probe_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${probe_log}"
            fi
            return "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${ALEX_MAIN_AGENT_PROBE_URL}/healthz" >"${health_json}"; then
              ready=1
              break
            fi
            if ! kill -0 "${probe_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat "${probe_log}"
            exit 1
          fi
          grep --fixed-strings '"bindings":15' "${health_json}"
          npm --prefix tests/browser test

  static-checks:
    # Validations that need neither Cargo nor the private vendor/ submodules.
    # The cargo jobs (test, browser-registry) structurally cannot run on PR branches
    # until DEN-2802 is resolved, because Cargo requires the optional
    # `dd-pg-defs-sea-orm` path dependency to exist even when its feature is off.
    # This job keeps real PR signal for the checks that do not have that constraint.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            ./.github/workflows/ci.yml
            ./.github/workflows/slack-ingress-browser-security.yml
      - name: Audit provider credential hygiene
        run: python3 scripts/audit-provider-secrets.py
      - name: Reject direct SQLx and boot-migration paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
