# Credential-free bridge CI: secret hygiene, formatting, warnings-denied Clippy,
# non-Postgres tests, browser automation, static SeaORM-policy checks, and the
# public flags-2-env audit. Private DPM/PostgreSQL certification and
# PostgreSQL-enabled images are owned by ORESoftware/k8s-cluster#1107.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHARED_COMMIT: e76b23cb2e23782438a3b03dacc26adfab1bb7fb
  EXPECTED_FLAGS_2_ENV_COMMIT: 8a978aef0cc9b12bdd0791d93bbf3a374c517ee2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Materialize optional SeaORM package metadata
        run: bash scripts/materialize-optional-seaorm-metadata.sh

      - name: Initialize only the public flags-2-env dependency
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- vendor/flags-2-env
          git -c protocol.version=2 submodule update --init vendor/flags-2-env
          test "$(git -C vendor/flags-2-env rev-parse HEAD)" = \
            "${EXPECTED_FLAGS_2_ENV_COMMIT}"

      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            ./.github/workflows/ci.yml
            ./.github/workflows/alex-main-agent-registry-boundary.yml
            ./.github/workflows/slack-ingress-browser-security.yml

      - name: Audit provider credential hygiene
        run: python3 scripts/audit-provider-secrets.py

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Validate credential-free SeaORM policy boundary
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/seaorm-policy.test.mjs
          test "$(git ls-tree HEAD vendor/k8s-libs-and-shared-defs | awk '{print $3}')" = \
            "${EXPECTED_SHARED_COMMIT}"
          grep -F \
            'dd-pg-defs-sea-orm = { path = "vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm", optional = true }' \
            Cargo.toml
          grep -F \
            'postgres = ["dep:sea-orm", "dep:dd-pg-defs-sea-orm"]' \
            Cargo.toml

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

      - name: Reject direct SQLx and boot-migration paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests

      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
      - run: make -B -C vendor/flags-2-env all
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml

  browser-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Materialize optional SeaORM package metadata
        run: bash scripts/materialize-optional-seaorm-metadata.sh

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Build loopback registry probe
        run: cargo build --locked --bin alex-main-agent-registry-browser

      - name: Install pinned browser test dependency
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise registry policy through Chromium
        env:
          ALEX_MAIN_AGENT_PROBE_ADDR: 127.0.0.1:8160
          ALEX_MAIN_AGENT_PROBE_URL: http://127.0.0.1:8160
          ALEX_MAIN_AGENT_REGISTRY_PATH: ${{ github.workspace }}/config/alex-main-agent.channels.json
        run: |
          set -euo pipefail
          probe_log="${RUNNER_TEMP}/alex-main-agent-registry-probe.log"
          health_json="${RUNNER_TEMP}/alex-main-agent-health.json"

          target/debug/alex-main-agent-registry-browser >"${probe_log}" 2>&1 &
          probe_pid=$!
          cleanup() {
            status=$?
            kill "${probe_pid}" 2>/dev/null || true
            wait "${probe_pid}" 2>/dev/null || true
            if [ "${status}" -ne 0 ]; then
              cat "${probe_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${ALEX_MAIN_AGENT_PROBE_URL}/healthz" >"${health_json}"; then
              ready=1
              break
            fi
            if ! kill -0 "${probe_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat "${probe_log}"
            exit 1
          fi
          jq -e '.status == "ok" and .bindings == 14' "${health_json}"
          npm --prefix tests/browser test
