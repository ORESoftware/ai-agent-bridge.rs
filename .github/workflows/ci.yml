# CI pipeline: formatting, clippy (warnings as errors), tests, a postgres-feature
# check, and a flags-2-env config audit, on every PR and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --features postgres -- -D warnings
      - name: Unit — renewal route matching
        run: cargo test --lib lease_renewal::tests::matches_only_canonical_and_one_id_compatibility_routes -- --exact --nocapture
      - name: Unit — renewal delay
        run: cargo test --lib runner::heartbeat::tests::renewal_delay_preserves_the_configured_margin -- --exact --nocapture
      - name: Unit — repeated heartbeat
        run: cargo test --lib runner::heartbeat::tests::long_operation_is_renewed_until_completion -- --exact --nocapture
      - name: Unit — heartbeat failure cancellation
        run: cargo test --lib runner::heartbeat::tests::renewal_failure_cancels_the_operation -- --exact --nocapture
      - name: Test remaining library units
        run: cargo test --lib --locked
      - name: Test binaries
        run: cargo test --bins --locked
      - name: Test lease-renewal integration
        run: cargo test --test lease_renewal --locked -- --nocapture
      - name: Test complete target matrix
        run: cargo test --all-targets --locked
      - run: cargo check --all-targets --locked --features postgres
      - name: Test PostgreSQL restart durability
        env:
          FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
        run: cargo test --locked --features postgres --test postgres_restart -- --ignored
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
      - run: make -B -C vendor/flags-2-env all
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml
