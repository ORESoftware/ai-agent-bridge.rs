name: SeaORM rustfmt one-shot

on:
  push:
    branches:
      - agent/seaorm-rustfmt-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seaorm-rustfmt-one-shot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'ORESoftware/ai-agent-bridge.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/seaorm-rustfmt-main
          persist-credentials: true
          submodules: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Format only the merged SeaORM database module
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db.rs
          if git diff --cached --quiet; then
            echo "src/db.rs is already formatted"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "src/db.rs"
          git commit -m "style: format merged SeaORM database module"
          git push origin HEAD:agent/seaorm-rustfmt-main
