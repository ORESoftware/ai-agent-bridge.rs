name: fix DEN-523 integration helper syntax

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: fix-den523-patch-script
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/den-523-bounded-provider-retries'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Repair the malformed multiline replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/apply-den523-retries.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "    admission: AdmissionControl,\\n    retry_policies: RetryPolicies,\\n    shutdown_tx: watch::Sender<bool>,\\n    providers: Arc<Vec<ProviderWorker>>,
",
          '''
          new = '''        "    admission: AdmissionControl,\\n    retry_policies: RetryPolicies,\\n    shutdown_tx: watch::Sender<bool>,\\n    providers: Arc<Vec<ProviderWorker>>,-END-",
          '''.replace(',-END-', ',')
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed replacement, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/ci/apply-den523-retries.py
          git diff --check
          git rm .github/workflows/fix-den523-patch-script.yml

      - name: Commit the repaired helper
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/ci/apply-den523-retries.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): repair DEN-523 integration helper'
          git push origin "HEAD:${HEAD_BRANCH}"
