name: seaorm-exact

on:
  pull_request:
    paths:
      - ".github/workflows/seaorm-exact.yml"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/db.rs"
      - "tests/postgres_restart.rs"
      - "scripts/check-seaorm-policy.mjs"
      - "scripts/seaorm-policy.test.mjs"
      - "vendor/k8s-libs-and-shared-defs"
      - "docs/postgres-seaorm.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaorm-exact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bridge
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      DPM_VERSION: 1.4.2
      DPM_SHA256: 42dd9d638a57edbde6c931d776a4ba295bcb2614e498203968c321d84ad90bdb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Materialize exact public shared authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/k8s-libs-and-shared-defs
          git init -q vendor/k8s-libs-and-shared-defs
          git -C vendor/k8s-libs-and-shared-defs remote add origin \
            https://github.com/ORESoftware/k8s-libs-and-shared-defs.git
          GIT_TERMINAL_PROMPT=0 git -C vendor/k8s-libs-and-shared-defs fetch \
            --no-tags --depth=1 origin "$EXPECTED_SHARED_COMMIT"
          git -C vendor/k8s-libs-and-shared-defs checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/k8s-libs-and-shared-defs rev-parse HEAD)" = "$EXPECTED_SHARED_COMMIT"
          test -z "$(git -C vendor/k8s-libs-and-shared-defs status --porcelain=v1 --untracked-files=all)"
      - name: Install pinned declarative-migrations CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="dpm.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/declarative-migrations/declarative-migrations/releases/download/v${DPM_VERSION}/declarative-postgres-migrate-linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DPM_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive"
          install -m 0755 declarative-postgres-migrate "$RUNNER_TEMP/declarative-postgres-migrate"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Apply canonical schema with declarative-migrations
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 test-results
          declarative-postgres-migrate apply \
            --database-url "$DATABASE_URL" \
            --schema-file vendor/k8s-libs-and-shared-defs/pg-defs/schema/schema.sql \
            > test-results/dpm-first-apply.txt
      - name: Validate policy and exact Rust behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/seaorm-policy.test.mjs
          EXPECTED_SHARED_COMMIT="$EXPECTED_SHARED_COMMIT" \
            node scripts/check-seaorm-policy.mjs
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features postgres -- -D warnings
          cargo test --locked --all-targets --features postgres
          cargo check --locked --all-targets --features postgres
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
      - name: Verify declarative convergence by idempotent re-apply
        shell: bash
        run: |
          set -euo pipefail
          declarative-postgres-migrate apply \
            --database-url "$DATABASE_URL" \
            --schema-file vendor/k8s-libs-and-shared-defs/pg-defs/schema/schema.sql \
            > test-results/dpm-second-apply.txt
      - name: Record non-secret exact-head evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 test-results
          sha256sum Cargo.lock > test-results/cargo-lock.sha256
          printf '%s\n' "$EXPECTED_SHARED_COMMIT" > test-results/shared-schema-commit.txt
          printf '%s\n' "$DPM_VERSION" > test-results/dpm-version.txt
          printf '%s\n' "$GITHUB_SHA" > test-results/workflow-merge-sha.txt
      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaorm-exact-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
