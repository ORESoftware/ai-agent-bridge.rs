name: Slack run modal surface

on:
  pull_request:
    paths:
      - .github/workflows/slack-modal-surface.yml
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - src/slack_project_bindings.rs
      - tests/slack_modal_fixture.rs
      - tests/browser/**
  push:
    branches: [main]
    paths:
      - .github/workflows/slack-modal-surface.yml
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - src/slack_project_bindings.rs
      - tests/slack_modal_fixture.rs
      - tests/browser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modal-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Verify committed modal fixtures match the real builder
        run: cargo test --locked --test slack_modal_fixture
      - name: Verify Block Kit acceptance ceilings
        run: cargo test --locked --lib block_kit_limit_tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned browser dependency
        working-directory: tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Assert the reviewed modal in Chromium
        working-directory: tests/browser
        run: npm run test:modal
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slack-modal-surface-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/browser/test-results
          retention-days: 7
          if-no-files-found: ignore
