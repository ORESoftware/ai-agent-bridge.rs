name: Slack run modal contract

on:
  pull_request:
    paths:
      - .github/workflows/slack-modal-surface.yml
      - docs/slack-run-modal-surface.md
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - src/slack_project_bindings.rs
      - tests/slack_modal_fixture.rs
      - tests/browser/fixtures/**
      - tests/browser/package.json
      - tests/browser/package-lock.json
      - tests/browser/specs/modal.spec.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/slack-modal-surface.yml
      - docs/slack-run-modal-surface.md
      - src/slack_commands.rs
      - src/slack_commands_parts/**
      - src/slack_project_bindings.rs
      - tests/slack_modal_fixture.rs
      - tests/browser/fixtures/**
      - tests/browser/package.json
      - tests/browser/package-lock.json
      - tests/browser/specs/modal.spec.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slack-run-modal-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
          show-progress: false

      - name: Reject committed browser outputs and dependencies
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '^tests/browser/(node_modules|playwright-report|test-results)/' || true)"
          if [[ -n "$tracked" ]]; then
            printf 'generated browser files must not be committed:\n%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/slack-modal-surface.yml

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Verify modal preview and Slack Block Kit ceilings
        run: |
          set -euo pipefail
          cargo test --locked --lib preview_run_modal_tests
          cargo test --locked --lib block_kit_limit_tests
          cargo test --locked --test slack_modal_fixture

      - name: Confirm committed fixtures are byte-stable
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_SLACK_MODAL_FIXTURES=1 cargo test --locked --test slack_modal_fixture
          if ! git diff --quiet -- tests/browser/fixtures; then
            echo '::error::The committed modal fixtures do not match the production builder.' >&2
            git --no-pager diff -- tests/browser/fixtures >&2
            exit 1
          fi

      - name: Strict Rust lint
        run: cargo clippy --locked --all-targets --features postgres -- -D warnings

      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install locked browser dependency without lifecycle scripts
        working-directory: tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium runtime
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Render and assert the reviewed modal
        working-directory: tests/browser
        run: npm run test:modal

      - name: Require a clean source tree outside ephemeral browser outputs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all \
            | grep -vE '^\?\? tests/browser/(node_modules|playwright-report|test-results)/' || true)"
          if [[ -n "$status" ]]; then
            printf 'unexpected source-tree drift:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-run-modal-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/browser/test-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false
