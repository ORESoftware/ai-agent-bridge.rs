# Verify container sources through the shared immutable ORESoftware image workflow.
# Publication remains disabled here until repository-specific registry readiness is reviewed.
name: images

on:
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "Dockerfile"
      - "Dockerfile.*.dkf"
      - "Containerfile"
      - "src/**"
      - "Cargo.*"
      - "package*.json"
      - "pubspec.*"
      - "go.*"
      - "gleam.toml"
      - "manifest.toml"
      - "scripts/ci/prepare-credential-free-build.sh"
      - "scripts/ci/fixtures/dd-pg-defs-sea-orm/**"
      - "config/shared-schema-pin"
  push:
    branches: [main]
    paths:
      - ".github/workflows/images.yml"
      - "Dockerfile"
      - "Dockerfile.*.dkf"
      - "Containerfile"
      - "src/**"
      - "Cargo.*"
      - "package*.json"
      - "pubspec.*"
      - "go.*"
      - "gleam.toml"
      - "manifest.toml"
      - "scripts/ci/prepare-credential-free-build.sh"
      - "scripts/ci/fixtures/dd-pg-defs-sea-orm/**"
      - "config/shared-schema-pin"
  workflow_dispatch:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    permissions:
      contents: read
    uses: ORESoftware/ores-gha-workflows/.github/workflows/container-images.yml@8765ad307f4a5a45120e7bc405e6af90095a33bc
    with:
      image-name: oresoftware/ai-agent-bridge
      submodules: "false"
      prepare_script: scripts/ci/prepare-credential-free-build.sh
      gcp-project: ""
      dockerhub-namespace: oresoftware
      push: false
