name: DEN-1042 format repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-1042-format-repair.yml'
      - 'src/slack_project_bindings.rs'

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1042-slack-project-bindings'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bridge:bridge-test-only@127.0.0.1:5432/bridge_restart
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1042-slack-project-bindings
          fetch-depth: 0
          submodules: recursive
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Verify expected source and apply rustfmt
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='d425e4711dc6879d344f4f4972f6657df3690019'
          actual_blob="$(git hash-object src/slack_project_bindings.rs)"
          test "$actual_blob" = "$expected_blob" || {
            echo "refusing format repair: expected $expected_blob, found $actual_blob" >&2
            exit 1
          }
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Validate complete Rust and policy suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-provider-secrets.py
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo check --all-targets --locked --features postgres
          cargo doc --locked --no-deps
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Remove one-shot workflow and publish formatted source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1042-format-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(DEN-1042): apply canonical registry formatting'
          git push origin HEAD:agent/den-1042-slack-project-bindings
