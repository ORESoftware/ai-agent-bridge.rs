name: DEN-3009 Benefactor binding repair

on:
  pull_request:
    branches: [main]
    paths:
      - config/alex-main-agent.channels.json
      - config/alex-main-agent.manifests.lock.json
      - scripts/audit_alex_main_agent_manifests.py
      - tests/benefactor_project_routing.rs
      - docs/benefactor-project-routing.md
      - .github/workflows/den-3009-benefactor-binding-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3009-benefactor-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-3009-benefactor-allowlist'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the Benefactor routing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch the canonical registry, audit policy, and lock digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          channel = "C0BKP367N95"
          default_repository = "benefactor-cc/benefactor-cc-mcp-server.rs"
          allowlist = [
              "benefactor-cc/benefactor-cc-mcp-server.rs",
              "benefactor-cc/backend.rs",
              "benefactor-cc/benefactor-sync",
              "benefactor-cc/benefactor-interfaces",
              "benefactor-cc/benefactor-e2e",
              "benefactor-cc/benefactor-automations",
              "benefactor-cc/benefactor-sendgrid-outreach",
              "benefactor-cc/benefactor-monorepo",
              "benefactor-cc/benefactor-lib",
              "benefactor-cc/benefactor-clients",
              "benefactor-cc/benefactor-cli",
              "benefactor-cc/.github",
              "ORESoftware/benefactor.cc",
              "ORESoftware/k8s-cluster",
          ]

          registry_path = Path("config/alex-main-agent.channels.json")
          registry = json.loads(registry_path.read_text())
          matches = [binding for binding in registry["bindings"] if binding["channel_id"] == channel]
          if len(matches) != 1:
              raise SystemExit(f"expected one Benefactor binding, found {len(matches)}")
          binding = matches[0]
          if binding["default_repository"] != default_repository:
              raise SystemExit("Benefactor default repository drifted")
          current = binding["repository_allowlist"]
          if current not in ([default_repository], allowlist):
              raise SystemExit(f"unexpected existing Benefactor allowlist: {current!r}")
          binding["repository_allowlist"] = allowlist
          binding["updated_by"] = "DEN-3009"
          binding["updated_at"] = "2026-08-08T16:50:26Z"
          registry_path.write_text(json.dumps(registry, indent=2) + "\n")

          audit_path = Path("scripts/audit_alex_main_agent_manifests.py")
          audit = audit_path.read_text()
          constants = '''BENEFACTOR_CHANNEL = "C0BKP367N95"\nBENEFACTOR_REPOSITORY_ALLOWLIST = (\n    "benefactor-cc/benefactor-cc-mcp-server.rs",\n    "benefactor-cc/backend.rs",\n    "benefactor-cc/benefactor-sync",\n    "benefactor-cc/benefactor-interfaces",\n    "benefactor-cc/benefactor-e2e",\n    "benefactor-cc/benefactor-automations",\n    "benefactor-cc/benefactor-sendgrid-outreach",\n    "benefactor-cc/benefactor-monorepo",\n    "benefactor-cc/benefactor-lib",\n    "benefactor-cc/benefactor-clients",\n    "benefactor-cc/benefactor-cli",\n    "benefactor-cc/.github",\n    "ORESoftware/benefactor.cc",\n    "ORESoftware/k8s-cluster",\n)\n'''
          if "BENEFACTOR_CHANNEL =" not in audit:
              anchor = '''FANWAAVE_REPOSITORY_ALLOWLIST = (\n    "fanwaave/push-notification-server.rs",\n    "fanwaave/.github",\n)\n'''
              if audit.count(anchor) != 1:
                  raise SystemExit("Fanwaave constant anchor drifted")
              audit = audit.replace(anchor, anchor + constants, 1)

          branch = '''        if channel == PILOT_CHANNEL:\n            expected_allowlist = list(PILOT_REPOSITORY_ALLOWLIST)\n        elif channel == FANWAAVE_CHANNEL:\n            expected_allowlist = list(FANWAAVE_REPOSITORY_ALLOWLIST)\n        else:\n            expected_allowlist = [repo]\n'''
          replacement = '''        if channel == PILOT_CHANNEL:\n            expected_allowlist = list(PILOT_REPOSITORY_ALLOWLIST)\n        elif channel == FANWAAVE_CHANNEL:\n            expected_allowlist = list(FANWAAVE_REPOSITORY_ALLOWLIST)\n        elif channel == BENEFACTOR_CHANNEL:\n            expected_allowlist = list(BENEFACTOR_REPOSITORY_ALLOWLIST)\n        else:\n            expected_allowlist = [repo]\n'''
          if "elif channel == BENEFACTOR_CHANNEL:" not in audit:
              if audit.count(branch) != 1:
                  raise SystemExit("allowlist policy branch drifted")
              audit = audit.replace(branch, replacement, 1)
          audit_path.write_text(audit)

          lock_path = Path("config/alex-main-agent.manifests.lock.json")
          lock = json.loads(lock_path.read_text())
          project_channels = {entry["slack"]["channel_id"] for entry in lock["entries"]}
          locked_registry = {
              "schema_version": registry["schema_version"],
              "bindings": [
                  item for item in registry["bindings"] if item["channel_id"] in project_channels
              ],
          }
          canonical = json.dumps(
              locked_registry,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          lock["central_registry"]["canonical_sha256"] = hashlib.sha256(canonical).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")
          PY

      - name: Run the offline manifest drift audit
        run: python3 scripts/audit_alex_main_agent_manifests.py

      - name: Prepare credential-free Rust inputs
        run: bash scripts/ci/prepare-credential-free-build.sh

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Check formatting and Benefactor routing tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --test benefactor_project_routing

      - name: Commit the canonical registry repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name alex-main-agent-routing-bot
          git config user.email alex-main-agent-routing-bot@users.noreply.github.com
          git add \
            config/alex-main-agent.channels.json \
            config/alex-main-agent.manifests.lock.json \
            scripts/audit_alex_main_agent_manifests.py
          if git diff --cached --quiet; then
            echo 'Benefactor routing registry already matches DEN-3009.'
            exit 0
          fi
          git commit -m 'DEN-3009 expand the Benefactor bridge allowlist'
          git push origin HEAD:${GITHUB_HEAD_REF}
