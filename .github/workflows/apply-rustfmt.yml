name: apply rustfmt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-den-490
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/den-490-authoritative-lease-descriptors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply safety rule, format, and commit once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lease_descriptors.rs')
          text = path.read_text()
          text = text.replace(
              'if response.status >= 400 {',
              'if !control_plane_success(response.status) {',
          )
          text = text.replace(
              'if response.status < 400 {',
              'if control_plane_success(response.status) {',
          )
          marker = 'fn control_plane_response(response: ControlPlaneResponse) -> Response {'
          helper = '''fn control_plane_success(status: u16) -> bool {
              (200..300).contains(&status)
          }

          '''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('control-plane response marker missing')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'fix: require 2xx authority responses'
          git push origin "HEAD:${HEAD_BRANCH}"
