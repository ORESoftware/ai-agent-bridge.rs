name: apply clippy fix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-clippy-fix-den-490
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/den-490-authoritative-lease-descriptors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Split wire payload types and commit once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lease_descriptors.rs')
          text = path.read_text()
          old = '''#[derive(Debug, Deserialize)]
          struct MutateCompatibleReq {
              agent_key: String,
              fencing_token: u64,
              #[serde(default = "default_ttl_ms")]
              ttl_ms: u64,
          }
          '''
          new = '''#[derive(Debug, Deserialize)]
          struct RenewCompatibleReq {
              agent_key: String,
              fencing_token: u64,
              #[serde(default = "default_ttl_ms")]
              ttl_ms: u64,
          }

          #[derive(Debug, Deserialize)]
          struct ReleaseCompatibleReq {
              agent_key: String,
              fencing_token: u64,
          }
          '''
          if old not in text:
              raise SystemExit('wire payload block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'serde_json::from_slice::<MutateCompatibleReq>(bytes)',
              'serde_json::from_slice::<RenewCompatibleReq>(bytes)',
              1,
          )
          text = text.replace(
              'serde_json::from_slice::<MutateCompatibleReq>(bytes)',
              'serde_json::from_slice::<ReleaseCompatibleReq>(bytes)',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lease_descriptors.rs
          git commit -m 'fix: split renewal and release payloads'
          git push origin "HEAD:${HEAD_BRANCH}"
