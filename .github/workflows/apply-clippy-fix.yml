name: apply clippy fix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-clippy-fix-den-489
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/den-489-runner-policy-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply compiler fixes and commit once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path('src/policy_admission.rs')
          text = module.read_text()
          text = text.replace('use serde_json::{json, Value};', 'use serde_json::json;')
          module.write_text(text)

          storage = Path('src/policy_admission/storage.rs')
          text = storage.read_text()
          text = text.replace(
              'admission: Option<AdmissionRecord>,',
              'admission: Option<Box<AdmissionRecord>>,',
              1,
          )
          text = text.replace(
              'self.admission = Some(admission);',
              'self.admission = Some(Box::new(admission));',
              1,
          )
          marker = '''    if !decision.allowed {
              return Err(AdmissionFailure::new(
                  StatusCode::CONFLICT,
                  "policy_denied",
                  decision
                      .denial_reason
                      .clone()
                      .unwrap_or_else(|| "policy denied managed execution".into()),
              ));
          }
          '''
          insertion = marker + '''    if decision.mode != plan.mode {
              return Err(AdmissionFailure::new(
                  StatusCode::CONFLICT,
                  "policy_mode_escalated",
                  "policy requires a different workflow mode; create a matching workflow plan",
              ));
          }
          '''
          if marker not in text:
              raise SystemExit('policy decision marker missing')
          text = text.replace(marker, insertion, 1)
          storage.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/policy_admission.rs src/policy_admission/storage.rs
          git commit -m 'fix: shrink admission errors and enforce mode integrity'
          git push origin "HEAD:${HEAD_BRANCH}"
