name: apply DEN-680 public metrics contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-den680-public-metrics
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/den-680-prometheus-metrics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: recursive

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Expose metrics through scoped security and add integration coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          middleware = Path('src/workflow_security/middleware.rs')
          text = middleware.read_text(encoding='utf-8')
          old = '    matches!(path, "/" | "/health" | "/healthz" | "/readyz")\n'
          new = '    matches!(path, "/" | "/health" | "/healthz" | "/readyz" | "/metrics")\n'
          if text.count(old) != 1:
              raise SystemExit('workflow-security public path marker missing or duplicated')
          middleware.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/metrics_scoped_auth.rs <<'RS'
          //! Full-stack scoped-auth coverage for the public Prometheus endpoint.

          mod common;

          use ai_agent_bridge::workflow_security::{self, WorkflowSecurity};
          use ai_agent_bridge::http;
          use axum::middleware::from_fn_with_state;

          #[tokio::test]
          async fn metrics_remain_public_when_scoped_adapter_auth_is_enabled() {
              let state = common::state();
              let security = WorkflowSecurity::from_json(
                  Some("operator-secret".into()),
                  r#"{
                    "credentials": [
                      {
                        "token_id": "codex-read-v1",
                        "token": "codex-scoped-secret",
                        "agent_key": "codex",
                        "scopes": ["agent:read"]
                      }
                    ]
                  }"#,
                  state.config.max_http_body_bytes,
              )
              .unwrap();
              let app = http::router(state.clone()).layer(from_fn_with_state(
                  security,
                  workflow_security::enforce,
              ));
              let listener = tokio::net::TcpListener::bind("127.0.0.1:0")
                  .await
                  .unwrap();
              let address = listener.local_addr().unwrap();
              tokio::spawn(async move {
                  let _ = axum::serve(listener, app).await;
              });

              let metrics = reqwest::get(format!("http://{address}/metrics"))
                  .await
                  .unwrap();
              assert!(metrics.status().is_success());
              let text = metrics.text().await.unwrap();
              assert!(text.contains("ai_agent_bridge_build_info"));

              let agents = reqwest::get(format!("http://{address}/agents"))
                  .await
                  .unwrap();
              assert_eq!(agents.status(), reqwest::StatusCode::UNAUTHORIZED);
          }
          RS

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo test --all-targets --locked --features postgres
          git diff --check

      - name: Remove one-shot workflow and commit the source contract
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-den680-public-metrics.yml
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(metrics): keep the scrape endpoint public under scoped auth'
          git push origin "HEAD:${HEAD_BRANCH}"
