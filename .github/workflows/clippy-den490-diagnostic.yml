name: DEN-490 Clippy diagnostic

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/clippy-den490-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/den-490-authoritative-lease-descriptors'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: clippy
      - name: Capture Clippy output
        id: clippy
        continue-on-error: true
        run: |
          set +e
          cargo clippy --all-targets --locked --features postgres -- -D warnings > clippy.log 2>&1
          status=$?
          printf '\nexit_code=%s\n' "$status" >> clippy.log
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: den490-clippy-log
          path: clippy.log
          retention-days: 1
          if-no-files-found: error
      - name: Preserve status
        env:
          STATUS: ${{ steps.clippy.outputs.status }}
        run: test "$STATUS" = 0
