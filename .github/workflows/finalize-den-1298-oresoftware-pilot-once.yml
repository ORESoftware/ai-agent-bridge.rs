# Same-repository pull-request finalizer; deleted from the branch on success.
name: Finalize DEN-1298 oresoftware pilot once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-den-1298-oresoftware-pilot-once.yml'
      - '.github/den-1298-oresoftware-pilot.patch'
  push:
    branches:
      - agent/den-1298-oresoftware-pilot
    paths:
      - .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml

permissions:
  contents: write

concurrency:
  group: finalize-den-1298-oresoftware-pilot-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pilot branch without private submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1298-oresoftware-pilot
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Apply reviewed meanings to the full current files
        shell: bash
        run: |
          set -euo pipefail
          base='03f38e876daec61eba587f6cb87393d3cc2a7dac'
          test "$(git merge-base HEAD "$base")" = "$base"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import textwrap
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} drifted: expected one match, got {count}')
              return source.replace(old, new, 1)

          # Add the pilot without reformatting the thirteen existing bindings.
          registry_path = Path('config/alex-main-agent.channels.json')
          registry_text = registry_path.read_text(encoding='utf-8')
          registry = json.loads(registry_text)
          if registry.get('schema_version') != 1 or len(registry.get('bindings', [])) != 13:
              raise SystemExit('central registry baseline is not the reviewed thirteen-binding shape')
          if any(binding.get('channel_id') == 'C0BKP2N3LG7' for binding in registry['bindings']):
              raise SystemExit('pilot binding already exists unexpectedly')
          pilot = {
              'workspace_id': 'T01B3C83PMK',
              'channel_id': 'C0BKP2N3LG7',
              'linear_team_id': 'eb8ab169-5afe-4b6f-9cab-3f2aa3e887dc',
              'linear_team_key': 'DEN',
              'linear_project_id': '7abf8be2-ffa5-4507-bd09-43aa59ca8718',
              'default_repository': 'ORESoftware/ai-agent-bridge.rs',
              'repository_allowlist': [
                  'ORESoftware/ai-agent-bridge.rs',
                  'ORESoftware/ai-agent-coordinator.rs',
                  'ORESoftware/k8s-cluster',
              ],
              'default_agent_mode': 'both-parallel',
              'allowed_agent_modes': [
                  'claude', 'chatgpt', 'both-parallel', 'both-sequential', 'review'
              ],
              'allowed_user_ids': ['U01AZNU2LJ2'],
              'allowed_user_group_ids': [],
              'write_policy': 'draft_pull_request',
              'budget_policy': {
                  'max_concurrent_runs': 4,
                  'max_runtime_secs': 900,
                  'max_tokens': 250000,
                  'max_spend_cents': 1000,
                  'max_retries': 2,
              },
              'updated_by': 'DEN-1298',
              'updated_at': '2026-08-04T11:00:00Z',
          }
          marker = '\n  ]\n}\n'
          if not registry_text.endswith(marker):
              raise SystemExit('central registry closing structure drifted')
          pilot_text = textwrap.indent(json.dumps(pilot, ensure_ascii=False, indent=2), '    ')
          registry_path.write_text(
              registry_text[:-len(marker)] + ',\n' + pilot_text + marker,
              encoding='utf-8',
          )

          docs_path = Path('docs/alex-main-agent-browser-tests.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = replace_once(
              docs,
              '- `config/alex-main-agent.channels.json` — reviewed 13-channel registry.',
              '- `config/alex-main-agent.channels.json` — thirteen manifest-backed project channels plus the separately reviewed `#oresoftware` control-plane pilot.',
              'browser documentation registry count',
          )
          docs = replace_once(
              docs,
              '6. verifies that all 13 bindings loaded;',
              '6. verifies that all 14 bindings loaded while the remote manifest audit remains scoped to the thirteen project-owned entries;',
              'browser documentation loaded count',
          )
          docs_path.write_text(docs, encoding='utf-8')

          audit_path = Path('scripts/audit_alex_main_agent_manifests.py')
          audit = audit_path.read_text(encoding='utf-8')
          audit = replace_once(
              audit,
              'COUNT = 13\nWORKSPACE = "T01B3C83PMK"\n',
              '''PROJECT_COUNT = 13
          CENTRAL_BINDING_COUNT = PROJECT_COUNT + 1
          WORKSPACE = "T01B3C83PMK"
          ''',
              'audit count constants',
          )
          audit = replace_once(
              audit,
              'REJECTED_DAEDALUS = "C0BMB9GSSKY"\nSHA1 = re.compile(r"[0-9a-f]{40}")\n',
              '''REJECTED_DAEDALUS = "C0BMB9GSSKY"
          PILOT_CHANNEL = "C0BKP2N3LG7"
          PILOT_LINEAR_PROJECT_ID = "7abf8be2-ffa5-4507-bd09-43aa59ca8718"
          PILOT_DEFAULT_REPOSITORY = "ORESoftware/ai-agent-bridge.rs"
          PILOT_REPOSITORY_ALLOWLIST = (
              "ORESoftware/ai-agent-bridge.rs",
              "ORESoftware/ai-agent-coordinator.rs",
              "ORESoftware/k8s-cluster",
          )
          SHA1 = re.compile(r"[0-9a-f]{40}")
          ''',
              'audit pilot constants',
          )
          audit = replace_once(
              audit,
              '''def canonical_json_sha256(value: Any) -> str:
              raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              return hashlib.sha256(raw).hexdigest()


          def as_obj''',
              '''def canonical_json_sha256(value: Any) -> str:
              raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              return hashlib.sha256(raw).hexdigest()


          def manifest_locked_registry(
              registry: Mapping[str, Any], project_channels: set[str]
          ) -> dict[str, Any]:
              obj = as_obj(registry, "central_registry")
              bindings = as_arr(obj.get("bindings"), "central_registry.bindings")
              return {
                  "schema_version": obj.get("schema_version"),
                  "bindings": [
                      binding
                      for binding in bindings
                      if isinstance(binding, dict)
                      and binding.get("channel_id") in project_channels
                  ],
              }


          def as_obj''',
              'manifest-locked registry projection',
          )
          audit = replace_once(
              audit,
              '''    if len(rows) != COUNT:
                  raise AuditError("contract_mismatch", f"expected {COUNT} lock entries")
          ''',
              '''    if len(rows) != PROJECT_COUNT:
                  raise AuditError(
                      "contract_mismatch", f"expected {PROJECT_COUNT} lock entries"
                  )
          ''',
              'lock project count',
          )
          audit = replace_once(
              audit,
              '''    if len(bindings) != COUNT:
                  raise AuditError("contract_mismatch", f"expected {COUNT} central bindings")
          ''',
              '''    if len(bindings) != CENTRAL_BINDING_COUNT:
                  raise AuditError(
                      "contract_mismatch",
                      f"expected {CENTRAL_BINDING_COUNT} central bindings",
                  )
          ''',
              'central binding count',
          )
          audit = replace_once(
              audit,
              '''        repo = pattern(binding["default_repository"], REPO, f"{label}.repository", "invalid_repository")
                  eq(string_list(binding["repository_allowlist"], f"{label}.allowlist"), [repo], f"{label}.allowlist")
          ''',
              '''        repo = pattern(binding["default_repository"], REPO, f"{label}.repository", "invalid_repository")
                  expected_allowlist = (
                      list(PILOT_REPOSITORY_ALLOWLIST)
                      if channel == PILOT_CHANNEL
                      else [repo]
                  )
                  eq(
                      string_list(binding["repository_allowlist"], f"{label}.allowlist"),
                      expected_allowlist,
                      f"{label}.allowlist",
                  )
          ''',
              'pilot repository allowlist',
          )
          audit = replace_once(
              audit,
              '''    if set(indexed) != {entry.slack["channel_id"] for entry in lock.entries}:
                  raise AuditError("contract_mismatch", "central/lock channel set")
              for entry in lock.entries:
          ''',
              '''    project_channels = {entry.slack["channel_id"] for entry in lock.entries}
              if set(indexed) != project_channels | {PILOT_CHANNEL}:
                  raise AuditError("contract_mismatch", "central/lock channel set")
              pilot = indexed[PILOT_CHANNEL]
              eq(pilot["linear_project_id"], PILOT_LINEAR_PROJECT_ID, "pilot project UUID")
              eq(pilot["default_repository"], PILOT_DEFAULT_REPOSITORY, "pilot repository")
              eq(pilot["updated_by"], "DEN-1298", "pilot owning issue")
              for entry in lock.entries:
          ''',
              'pilot channel-set boundary',
          )
          audit = replace_once(
              audit,
              '''    registry = parse_json_bytes(read_bounded(registry_path, MAX_REGISTRY, "central registry"), "central registry")
              registry_digest = canonical_json_sha256(registry)
              eq(registry_digest, lock.registry["canonical_sha256"], "central registry canonical SHA-256")
              validate_registry(registry, lock)
              manifests = []
          ''',
              '''    registry = parse_json_bytes(read_bounded(registry_path, MAX_REGISTRY, "central registry"), "central registry")
              validate_registry(registry, lock)
              project_channels = {entry.slack["channel_id"] for entry in lock.entries}
              registry_digest = canonical_json_sha256(
                  manifest_locked_registry(registry, project_channels)
              )
              eq(
                  registry_digest,
                  lock.registry["canonical_sha256"],
                  "project registry canonical SHA-256",
              )
              manifests = []
          ''',
              'project-registry digest boundary',
          )
          audit = replace_once(
              audit,
              '''    return {"schema_version": 1, "status": "pass", "mode": "remote" if remote_fetcher else "offline", "central_registry": {"path": lock.registry["path"], "canonical_sha256": registry_digest, "bindings": len(manifests)}, "manifests": manifests}
          ''',
              '''    binding_count = len(as_arr(registry["bindings"], "central_registry.bindings"))
              return {"schema_version": 1, "status": "pass", "mode": "remote" if remote_fetcher else "offline", "central_registry": {"path": lock.registry["path"], "canonical_sha256": registry_digest, "bindings": binding_count, "manifest_bindings": len(manifests)}, "manifests": manifests}
          ''',
              'audit report binding counts',
          )
          audit_path.write_text(audit, encoding='utf-8')

          rust_path = Path('tests/alex_main_agent_registry.rs')
          rust = rust_path.read_text(encoding='utf-8')
          old_first_test = '''#[test]
          fn alex_main_agent_registry_parses_all_project_bindings() {
              let registry = SlackProjectRegistry::from_json(REGISTRY).expect("registry must be valid");
              assert_eq!(registry.binding_count(), 13);
          }
          '''
          new_first_test = '''#[test]
          fn alex_main_agent_registry_parses_all_project_bindings() {
              let registry = SlackProjectRegistry::from_json(REGISTRY).expect("registry must be valid");
              assert_eq!(registry.binding_count(), 14);
          }

          #[test]
          fn oresoftware_pilot_resolves_only_reviewed_control_plane_repositories() {
              let registry = SlackProjectRegistry::from_json(REGISTRY).expect("registry must be valid");
              let mut request = request("C0BKP2N3LG7", ALEX_USER_ID);
              request.requested_repository = Some("ORESoftware/k8s-cluster".to_string());
              request.linear_issue_identifier = Some("DEN-1298".to_string());

              let context = registry.resolve(&request).expect("pilot route must resolve");
              assert_eq!(
                  context.linear_project_id,
                  "7abf8be2-ffa5-4507-bd09-43aa59ca8718"
              );
              assert_eq!(context.repository, "ORESoftware/k8s-cluster");
              assert_eq!(context.write_policy, WritePolicy::DraftPullRequest);
              assert_eq!(
                  context.issue.expect("issue must be parsed").identifier,
                  "DEN-1298"
              );

              request.requested_repository = Some("ORESoftware/unreviewed-repository".to_string());
              assert!(matches!(
                  registry.resolve(&request),
                  Err(RegistryError::RepositoryNotAllowed)
              ));
          }
          '''
          rust = replace_once(rust, old_first_test, new_first_test, 'Rust pilot registry tests')
          rust_path.write_text(rust, encoding='utf-8')

          py_test_path = Path('tests/test_audit_alex_main_agent_manifests.py')
          py_test = py_test_path.read_text(encoding='utf-8')
          old_helper = '''            lock_value = copy.deepcopy(lock if lock is not None else self.lock)
                      lock_value["central_registry"]["canonical_sha256"] = manifest_audit.canonical_json_sha256(
                          registry if registry is not None else self.registry
                      )
          '''
          new_helper = '''            lock_value = copy.deepcopy(lock if lock is not None else self.lock)
                      registry_value = registry if registry is not None else self.registry
                      project_channels = {
                          entry["slack"]["channel_id"] for entry in lock_value["entries"]
                      }
                      lock_value["central_registry"]["canonical_sha256"] = (
                          manifest_audit.canonical_json_sha256(
                              manifest_audit.manifest_locked_registry(
                                  registry_value, project_channels
                              )
                          )
                      )
          '''
          py_test = replace_once(py_test, old_helper, new_helper, 'Python audit test helper')
          old_remote_test = '''    def test_remote_audit_verifies_all_thirteen_exact_heads(self):
                  report = self._audit(fetcher=self._fetcher())
                  self.assertEqual(report["status"], "pass")
                  self.assertEqual(report["mode"], "remote")
                  self.assertEqual(report["central_registry"]["bindings"], 13)
                  self.assertEqual({item["status"] for item in report["manifests"]}, {"verified"})

          '''
          new_remote_test = '''    def test_remote_audit_verifies_thirteen_project_heads_and_pilot_binding(self):
                  report = self._audit(fetcher=self._fetcher())
                  self.assertEqual(report["status"], "pass")
                  self.assertEqual(report["mode"], "remote")
                  self.assertEqual(report["central_registry"]["bindings"], 14)
                  self.assertEqual(report["central_registry"]["manifest_bindings"], 13)
                  self.assertEqual({item["status"] for item in report["manifests"]}, {"verified"})

              def test_pilot_binding_is_excluded_from_project_manifest_digest(self):
                  project_channels = {
                      entry["slack"]["channel_id"] for entry in self.lock["entries"]
                  }
                  projected = manifest_audit.manifest_locked_registry(
                      self.registry, project_channels
                  )
                  self.assertEqual(len(projected["bindings"]), 13)
                  self.assertEqual(
                      manifest_audit.canonical_json_sha256(projected),
                      self.lock["central_registry"]["canonical_sha256"],
                  )

              def test_missing_pilot_binding_fails_closed(self):
                  registry = copy.deepcopy(self.registry)
                  registry["bindings"] = [
                      binding
                      for binding in registry["bindings"]
                      if binding["channel_id"] != manifest_audit.PILOT_CHANNEL
                  ]
                  with self.assertRaisesRegex(
                      manifest_audit.AuditError, "expected 14 central bindings"
                  ):
                      self._audit(registry=registry)

              def test_pilot_repository_allowlist_drift_fails_closed(self):
                  registry = copy.deepcopy(self.registry)
                  pilot = next(
                      binding
                      for binding in registry["bindings"]
                      if binding["channel_id"] == manifest_audit.PILOT_CHANNEL
                  )
                  pilot["repository_allowlist"].append("ORESoftware/unreviewed-repository")
                  with self.assertRaisesRegex(manifest_audit.AuditError, "contract_mismatch"):
                      self._audit(registry=registry)

          '''
          py_test = replace_once(py_test, old_remote_test, new_remote_test, 'Python pilot audit tests')
          py_test_path.write_text(py_test, encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Validate pilot routing and manifest-lock boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/alex-main-agent.channels.json >/dev/null
          python3 -m unittest tests.test_audit_alex_main_agent_manifests

          stub='vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm'
          mkdir -p "$stub/src"
          cat >"$stub/Cargo.toml" <<'TOML'
          [package]
          name = "dd-pg-defs-sea-orm"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [lib]
          path = "src/lib.rs"
          TOML
          printf '%s\n' '#![forbid(unsafe_code)]' >"$stub/src/lib.rs"

          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --test alex_main_agent_registry
          rm -rf vendor/k8s-libs-and-shared-defs
          git diff --check

          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('config/alex-main-agent.channels.json').read_text())
          bindings = registry['bindings']
          assert len(bindings) == 14
          pilot = [item for item in bindings if item['channel_id'] == 'C0BKP2N3LG7']
          assert len(pilot) == 1
          assert pilot[0]['repository_allowlist'] == [
              'ORESoftware/ai-agent-bridge.rs',
              'ORESoftware/ai-agent-coordinator.rs',
              'ORESoftware/k8s-cluster',
          ]
          PY

      - name: Commit and push the clean five-file product
        shell: bash
        run: |
          set -euo pipefail
          base='03f38e876daec61eba587f6cb87393d3cc2a7dac'
          rm -rf \
            .github/den-1298-pilot-patch \
            .github/den-1298-oresoftware-pilot.patch \
            .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml \
            vendor/k8s-libs-and-shared-defs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-1298): add the oresoftware control-plane pilot'
          expected=$'config/alex-main-agent.channels.json\ndocs/alex-main-agent-browser-tests.md\nscripts/audit_alex_main_agent_manifests.py\ntests/alex_main_agent_registry.rs\ntests/test_audit_alex_main_agent_manifests.py'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected final product paths:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }
          git push origin HEAD:agent/den-1298-oresoftware-pilot
