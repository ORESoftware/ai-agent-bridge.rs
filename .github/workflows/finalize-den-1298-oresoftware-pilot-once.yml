name: Finalize DEN-1298 oresoftware pilot once

on:
  push:
    branches:
      - agent/den-1298-oresoftware-pilot
    paths:
      - .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml

permissions:
  contents: write

concurrency:
  group: finalize-den-1298-oresoftware-pilot-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pilot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1298-oresoftware-pilot
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: recursive

      - name: Reconstruct and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base='03f38e876daec61eba587f6cb87393d3cc2a7dac'
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(find .github/den-1298-pilot-patch -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 4
          cat .github/den-1298-pilot-patch/part-*.b64 | base64 --decode >"${RUNNER_TEMP}/den-1298-pilot.patch"
          printf '%s  %s\n' \
            'c179fe2a865f16d7ea0c8be6f21af4453b3ae799f9db4e83a1bcd4924bc60100' \
            "${RUNNER_TEMP}/den-1298-pilot.patch" \
            | sha256sum --check --strict
          git apply --check "${RUNNER_TEMP}/den-1298-pilot.patch"
          git apply --index "${RUNNER_TEMP}/den-1298-pilot.patch"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Validate pilot routing and manifest-lock boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/alex-main-agent.channels.json >/dev/null
          python3 -m unittest tests.test_audit_alex_main_agent_manifests
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --test alex_main_agent_registry
          git diff --check

          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('config/alex-main-agent.channels.json').read_text())
          bindings = registry['bindings']
          assert len(bindings) == 14
          pilot = [item for item in bindings if item['channel_id'] == 'C0BKP2N3LG7']
          assert len(pilot) == 1
          pilot = pilot[0]
          assert pilot['linear_project_id'] == '7abf8be2-ffa5-4507-bd09-43aa59ca8718'
          assert pilot['default_repository'] == 'ORESoftware/ai-agent-bridge.rs'
          assert pilot['repository_allowlist'] == [
              'ORESoftware/ai-agent-bridge.rs',
              'ORESoftware/ai-agent-coordinator.rs',
              'ORESoftware/k8s-cluster',
          ]
          assert pilot['allowed_user_ids'] == ['U01AZNU2LJ2']
          assert pilot['write_policy'] == 'draft_pull_request'
          PY

      - name: Commit and push the clean five-file product
        shell: bash
        run: |
          set -euo pipefail
          base='03f38e876daec61eba587f6cb87393d3cc2a7dac'
          rm -rf \
            .github/den-1298-pilot-patch \
            .github/workflows/finalize-den-1298-oresoftware-pilot-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-1298): add the oresoftware control-plane pilot'
          expected=$'config/alex-main-agent.channels.json\ndocs/alex-main-agent-browser-tests.md\nscripts/audit_alex_main_agent_manifests.py\ntests/alex_main_agent_registry.rs\ntests/test_audit_alex_main_agent_manifests.py'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected final product paths:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }
          git push origin HEAD:agent/den-1298-oresoftware-pilot
