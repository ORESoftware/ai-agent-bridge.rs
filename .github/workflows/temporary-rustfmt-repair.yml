name: Temporary rustfmt repair

on:
  push:
    branches:
      - agent/den-601-ores-service-client

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and publish rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/ores-ai-agent-bridge.rs tests/ores_ai_agent_bridge_cli.rs src/service_identity.rs src/lib.rs
          git commit -m 'chore: apply rustfmt'
          git push origin HEAD:${GITHUB_REF_NAME}
