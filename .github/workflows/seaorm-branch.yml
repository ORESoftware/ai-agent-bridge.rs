name: seaorm-branch

# Temporary exact-branch writer. Removed after it commits the reviewed shared
# gitlink and regenerated Cargo.lock. It never runs for forks, PR targets, or main.
on:
  push:
    branches:
      - agent/seaorm-shared-schema-20260804
    paths:
      - ".github/workflows/seaorm-branch.yml"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/db.rs"
      - "tests/postgres_restart.rs"
      - "scripts/seaorm-policy.mjs"
      - "scripts/seaorm-policy.test.mjs"
      - "scripts/check-seaorm-policy.mjs"
      - "vendor/k8s-libs-and-shared-defs"

permissions:
  contents: write

concurrency:
  group: ai-agent-bridge-seaorm-branch
  cancel-in-progress: true

jobs:
  generate-lock-and-verify:
    if: >-
      github.repository == 'ORESoftware/ai-agent-bridge.rs' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      DPM_INSTALLER_COMMIT: f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc
      FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
      SHADOW_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Pin the public shared schema and generated SeaORM adapter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/k8s-libs-and-shared-defs
          git init -q vendor/k8s-libs-and-shared-defs
          git -C vendor/k8s-libs-and-shared-defs remote add origin \
            https://github.com/ORESoftware/k8s-libs-and-shared-defs.git
          GIT_TERMINAL_PROMPT=0 git -C vendor/k8s-libs-and-shared-defs fetch \
            --no-tags --depth=1 origin "$EXPECTED_SHARED_COMMIT"
          git -C vendor/k8s-libs-and-shared-defs checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/k8s-libs-and-shared-defs rev-parse HEAD)" = \
            "$EXPECTED_SHARED_COMMIT"
          test -z "$(git -C vendor/k8s-libs-and-shared-defs status --porcelain=v1 --untracked-files=all)"
      - name: Validate shared authority and mutation policy
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/seaorm-policy.test.mjs
          node scripts/check-seaorm-policy.mjs
      - name: Install the pinned declarative migration tool
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/declarative-migrations/declarative-postgres-migrate.rs/${DPM_INSTALLER_COMMIT}/scripts/install.sh" \
            | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provision the disposable database from DPM bootstrap output
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          vendor/k8s-libs-and-shared-defs/pg-defs/scripts/dpm.sh bootstrap \
            > "${RUNNER_TEMP}/canonical-schema.sql"
          psql "$FIDUCIA_BRIDGE_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f "${RUNNER_TEMP}/canonical-schema.sql"
      - name: Generate lockfile and execute exact Rust validation
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo check --all-targets --locked --features postgres
          cargo test --locked --features postgres --test postgres_restart -- --ignored
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src tests
      - name: Commit the immutable shared pin and generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add vendor/k8s-libs-and-shared-defs Cargo.lock
          if git diff --cached --quiet; then
            echo 'Shared gitlink and Cargo.lock already match the reviewed inputs.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: pin shared SeaORM contract and lockfile [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
