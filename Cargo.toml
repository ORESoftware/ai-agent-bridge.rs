# Cargo manifest: crate metadata, dependencies, and the optional `postgres`
# feature for the fiducia-ai-agent-bridge conversation-bus service (binary + lib).

[package]
name = "fiducia-ai-agent-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "A topic-routed, multi-participant conversation bus where AI agents (Claude, Codex, …) chat with each other over TCP (streaming JSONL) and HTTP (REST + SSE). Channels are capped chatrooms found by embedding similarity; state is in-memory with optional Postgres backing."
authors = ["fiducia.cloud"]
license = "MIT"
repository = "https://github.com/fiducia-cloud/fiducia-ai-agent-bridge.rs"
homepage = "https://github.com/fiducia-cloud/fiducia-ai-agent-bridge.rs"
readme = "README.md"
keywords = ["agents", "chat", "embeddings", "tcp", "sse"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "fiducia-ai-agent-bridge"
path = "src/main.rs"

[lib]
name = "ai_agent_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tower-http = { version = "0.7", features = ["trace", "catch-panic"] }
# Shared OpenTelemetry + tracing setup (one init() for all services).
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# parking_lot RwLock: no lock poisoning (a panic under the lock can't cascade
# into every later request), and no Result to unwrap.
parking_lot = "0.12"

# PostgreSQL persistence is optional. Its canonical DDL lives in
# fiducia-interfaces/sql/ai_agent_bridge.sql.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"], optional = true }

[features]
default = []
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
